<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title>次數0～6，映射成另一個範圍的命令</title><desc>角度命令、紙盤位置與真正量角結果必須分開記錄。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="580" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">次數0～6，映射成另一個範圍的命令</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">角度命令、紙盤位置與真正量角結果必須分開記錄。</text><rect x="55" y="165" width="145" height="190" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="127" y="220" font-size="34" fill="#1765ad" text-anchor="middle">0</text><text x="127" y="295" font-size="24" fill="#183047" text-anchor="middle">30°命令</text><line x1="200" y1="340" x2="216" y2="340" stroke="#1765ad" stroke-width="3"/><path d="M204.59142669542516,333.7674679981454 L216,340 L204.59142669542516,346.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="221" y="165" width="145" height="190" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="293" y="220" font-size="34" fill="#1765ad" text-anchor="middle">1</text><text x="293" y="295" font-size="24" fill="#183047" text-anchor="middle">50°命令</text><line x1="366" y1="340" x2="382" y2="340" stroke="#1765ad" stroke-width="3"/><path d="M370.5914266954251,333.7674679981454 L382,340 L370.5914266954251,346.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="387" y="165" width="145" height="190" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="459" y="220" font-size="34" fill="#1765ad" text-anchor="middle">2</text><text x="459" y="295" font-size="24" fill="#183047" text-anchor="middle">70°命令</text><line x1="532" y1="340" x2="548" y2="340" stroke="#1765ad" stroke-width="3"/><path d="M536.5914266954252,333.7674679981454 L548,340 L536.5914266954252,346.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="553" y="165" width="145" height="190" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="625" y="220" font-size="34" fill="#1765ad" text-anchor="middle">3</text><text x="625" y="295" font-size="24" fill="#183047" text-anchor="middle">90°命令</text><line x1="698" y1="340" x2="714" y2="340" stroke="#1765ad" stroke-width="3"/><path d="M702.5914266954252,333.7674679981454 L714,340 L702.5914266954252,346.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="719" y="165" width="145" height="190" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="791" y="220" font-size="34" fill="#1765ad" text-anchor="middle">4</text><text x="791" y="295" font-size="24" fill="#183047" text-anchor="middle">110°命令</text><line x1="864" y1="340" x2="880" y2="340" stroke="#1765ad" stroke-width="3"/><path d="M868.5914266954252,333.7674679981454 L880,340 L868.5914266954252,346.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="885" y="165" width="145" height="190" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="957" y="220" font-size="34" fill="#1765ad" text-anchor="middle">5</text><text x="957" y="295" font-size="24" fill="#183047" text-anchor="middle">130°命令</text><line x1="1030" y1="340" x2="1046" y2="340" stroke="#1765ad" stroke-width="3"/><path d="M1034.591426695425,333.7674679981454 L1046,340 L1034.591426695425,346.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="1051" y="165" width="145" height="190" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="1123" y="220" font-size="34" fill="#1765ad" text-anchor="middle">6</text><text x="1123" y="295" font-size="24" fill="#183047" text-anchor="middle">150°命令</text><text x="35" y="413" font-size="28" fill="#183047" text-anchor="start">七個位置，六個間隔：(150 − 30) ÷ 6 = 20度／格。</text><text x="35" y="473" font-size="28" fill="#087768" text-anchor="start">count=4 → 30 + 4 × 20 = 110；扣一次回3 → 90。</text><text x="35" y="535" font-size="24" fill="#ae2842" text-anchor="start">30～150度是計算示例，不是本片舵機核准行程；實際位置須觀察。</text></svg>
