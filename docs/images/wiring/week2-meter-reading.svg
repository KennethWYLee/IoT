<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="908" viewBox="0 0 1050 908" role="img" aria-labelledby="title desc"><title id="title">數字在哪一邊？現在是什麼檔位？</title><desc id="desc">A830L讀表示例：左側單獨1與右側0.6；區分Ω數值和通斷聲音。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1050" height="908" fill="white"/><text x="32" y="49" font-size="32" fill="#183047" text-anchor="start" font-weight="700">數字在哪一邊？現在是什麼檔位？</text><text x="32" y="96" font-size="22" fill="#183047" text-anchor="start" font-weight="400">以下為示意LCD，不是新實測照片。兩欄都選「電阻區 Ω 200」，待測物完全斷電。</text><rect x="28" y="135" width="484" height="342" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="51" y="178" font-size="27" fill="#1765ad" text-anchor="start" font-weight="700">兩支表筆分開</text><rect x="53" y="207" width="434" height="101" rx="5" fill="#e5ecd8" stroke="#849271"/><text x="71" y="278" font-size="48" fill="#183047" text-anchor="start" font-weight="700">1</text><text x="51" y="354" font-size="25" fill="#183047" text-anchor="start" font-weight="700">左側單獨1：狀態提示</text><text x="51" y="401" font-size="23" fill="#183047" text-anchor="start" font-weight="400">開路或超量程，不是1 Ω。</text><text x="51" y="448" font-size="22" fill="#183047" text-anchor="start" font-weight="400">短接仍如此，先查接觸與插孔。</text><rect x="535" y="135" width="484" height="342" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="558" y="178" font-size="27" fill="#1765ad" text-anchor="start" font-weight="700">尖端穩定相碰</text><rect x="560" y="207" width="434" height="101" rx="5" fill="#e5ecd8" stroke="#849271"/><text x="968" y="278" font-size="48" fill="#183047" text-anchor="end" font-weight="700">0.6</text><text x="558" y="354" font-size="25" fill="#183047" text-anchor="start" font-weight="700">0.6 Ω：低電阻通路</text><text x="558" y="401" font-size="23" fill="#183047" text-anchor="start" font-weight="400">含表筆與接觸電阻，不必恰好0。</text><text x="558" y="448" font-size="22" fill="#183047" text-anchor="start" font-weight="400">若不穩定，先固定接觸與核對插孔。</text><rect x="28" y="510" width="991" height="171" rx="10" fill="#edf5ff" stroke="#c6d4e0" stroke-width="2"/><text x="50" y="552" font-size="25" fill="#1765ad" text-anchor="start" font-weight="700">改成聲波符號的通斷檔，才用「蜂鳴」作判斷。</text><text x="50" y="599" font-size="24" fill="#183047" text-anchor="start" font-weight="400">分開：不蜂鳴；穩定碰觸：應蜂鳴。不要求Ω 200一定會響。</text><text x="50" y="647" font-size="23" fill="#183047" text-anchor="start" font-weight="400">蜂鳴有門檻，不代表剛好0 Ω；未確認的61、198、5x不補單位。</text><rect x="28" y="716" width="991" height="158" rx="10" fill="#fff5ef" stroke="#c6d4e0" stroke-width="2"/><text x="50" y="758" font-size="25" fill="#ad2944" text-anchor="start" font-weight="700">黑COM、紅VΩmA；10A孔保持空置。</text><text x="50" y="805" font-size="23" fill="#183047" text-anchor="start" font-weight="400">V區的200是電壓量程，A區200m是電流量程；都不是Ω 200。</text><text x="50" y="852" font-size="23" fill="#183047" text-anchor="start" font-weight="400">本週不量電壓或電流；通斷由電表自己的電池提供小測試訊號。</text></svg>
