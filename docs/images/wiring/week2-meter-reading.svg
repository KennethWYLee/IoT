<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="731" viewBox="0 0 1370 731" role="img" aria-labelledby="title desc"><title id="title">數字先配功能：有聲音與數值小，是兩件事</title><desc id="desc">三欄比較通斷、200歐姆及其他200量程，非新增電表照片或實測畫面。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1370" height="731" fill="white"/><text x="32" y="49" font-size="32" fill="#183047" text-anchor="start" font-weight="700">數字先配功能：有聲音與數值小，是兩件事</text><text x="32" y="97" font-size="23" fill="#183047" text-anchor="start" font-weight="400">以A830L的斷電檢查為例；其他型號依符號、量程與說明書，不靠藍黑顏色選檔。</text><rect x="28" y="137" width="423" height="355" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="50" y="186" font-size="27" fill="#1765ad" text-anchor="start" font-weight="700">通斷／蜂鳴檔</text><text x="50" y="250" font-size="23" fill="#183047" text-anchor="start" font-weight="400">兩表筆分開：不蜂鳴</text><text x="50" y="309" font-size="23" fill="#183047" text-anchor="start" font-weight="400">穩定碰觸：蜂鳴</text><text x="50" y="368" font-size="23" fill="#183047" text-anchor="start" font-weight="400">聲音代表低於該表門檻。</text><text x="50" y="427" font-size="23" fill="#183047" text-anchor="start" font-weight="400">不表示剛好0Ω。</text><rect x="473" y="137" width="423" height="355" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="495" y="186" font-size="27" fill="#1765ad" text-anchor="start" font-weight="700">電阻區 Ω 200</text><text x="495" y="250" font-size="23" fill="#183047" text-anchor="start" font-weight="400">兩表筆分開：左側1</text><text x="495" y="309" font-size="23" fill="#183047" text-anchor="start" font-weight="400">穩定碰觸：例如0.6</text><text x="495" y="368" font-size="23" fill="#183047" text-anchor="start" font-weight="400">0.6讀成0.6Ω；1可代表</text><text x="495" y="427" font-size="23" fill="#183047" text-anchor="start" font-weight="400">開路／超量程，不是1Ω。</text><rect x="918" y="137" width="423" height="355" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="940" y="186" font-size="27" fill="#1765ad" text-anchor="start" font-weight="700">其他區也有200</text><text x="940" y="250" font-size="23" fill="#183047" text-anchor="start" font-weight="400">V區：電壓量程</text><text x="940" y="309" font-size="23" fill="#183047" text-anchor="start" font-weight="400">A區200m：電流量程</text><text x="940" y="368" font-size="23" fill="#183047" text-anchor="start" font-weight="400">不能只找數字200。</text><text x="940" y="427" font-size="23" fill="#183047" text-anchor="start" font-weight="400">本週不做電壓／電流量測。</text><rect x="28" y="527" width="1313" height="170" rx="10" fill="#fff5ef" stroke="#c6d4e0" stroke-width="2"/><text x="52" y="575" font-size="25" fill="#183047" text-anchor="start" font-weight="400">固定表筆：黑 → COM；紅 → VΩmA；10A孔空著。待測物的USB與電池都移除。</text><text x="52" y="625" font-size="25" fill="#183047" text-anchor="start" font-weight="400">61、198或5x缺少功能與小數點，就不能當作可靠Ω值；先改善接觸再判讀。</text><text x="52" y="671" font-size="25" fill="#ad2944" text-anchor="start" font-weight="400">電表用自己的電池做通斷測試。不要在ESP32帶電時使用通斷或電阻檔。</text></svg>
