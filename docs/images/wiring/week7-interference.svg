<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="795" viewBox="0 0 1200 795" role="img"><title>輸出不應自己製造下一次遮光事件</title><desc>桌面布局示意，非實機無干擾保證；每次只改一項因素。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="795" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">輸出不應自己製造下一次遮光事件</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">桌面布局示意，非實機無干擾保證；每次只改一項因素。</text><rect x="35" y="145" width="1130" height="430" rx="12" fill="#faf8ed" stroke="#bacbd7" stroke-width="2"/><rect x="90" y="215" width="290" height="145" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="235" y="270" font-size="30" fill="#1765ad" text-anchor="middle">RGB／OLED</text><text x="235" y="325" font-size="25" fill="#183047" text-anchor="middle">玩家清楚看見</text><rect x="780" y="215" width="315" height="145" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="937" y="270" font-size="30" fill="#087768" text-anchor="middle">KY手勢區</text><text x="937" y="325" font-size="24" fill="#183047" text-anchor="middle">只讓手勢改變光線</text><rect x="425" y="410" width="335" height="125" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="592" y="460" font-size="29" fill="#087768" text-anchor="middle">0～6短紙指針</text><text x="592" y="509" font-size="24" fill="#183047" text-anchor="middle">掃動區避開KY與手</text><line x1="385" y1="265" x2="770" y2="265" stroke="#ae2842" stroke-width="3"/><path d="M758.5914266954252,258.7674679981454 L770,265 L758.5914266954252,271.2325320018546" fill="none" stroke="#ae2842" stroke-width="3"/><text x="575" y="238" font-size="23" fill="#ae2842" text-anchor="middle">隔開燈光路徑</text><line x1="765" y1="459" x2="950" y2="365" stroke="#ae2842" stroke-width="3"/><path d="M937.0058055667905,364.6115273086192 L950,365 L942.6523182866508,375.72434489557816" fill="none" stroke="#ae2842" stroke-width="3"/><text x="985" y="457" font-size="24" fill="#ae2842" text-anchor="middle">注意指針陰影</text><text x="35" y="634" font-size="25" fill="#183047" text-anchor="start">測試A：不遮光，固定其他條件，只改RGB關／紅／綠。</text><text x="35" y="691" font-size="24" fill="#183047" text-anchor="start">測試B：固定燈與KY，只改已核准指針0／3／6；不故意卡住或弱化電池。</text><text x="35" y="746" font-size="26" fill="#ae2842" text-anchor="start">輸出自己觸發輸入，就先停局調整布局；不能算玩家失誤。</text></svg>
