<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img"><title>相對濕度：先說清楚「相對於什麼」</title><desc>物理量說明的示例，不是學生實測，也不是sensor精度證明。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="740" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">相對濕度：先說清楚「相對於什麼」</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">物理量說明的示例，不是學生實測，也不是sensor精度證明。</text><rect x="35" y="145" width="1130" height="385" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="65" y="192" font-size="28" fill="#1765ad" text-anchor="start">同一個溫度下的假設壓力例子：</text><text x="65" y="264" font-size="26" fill="#183047" text-anchor="start">實際水蒸氣壓</text><rect x="345" y="228" width="330" height="52" rx="12" fill="#78afdb" stroke="#bccbd8" stroke-width="2"/><text x="705" y="263" font-size="28" fill="#183047" text-anchor="start">2 kPa</text><text x="65" y="359" font-size="26" fill="#183047" text-anchor="start">飽和水蒸氣壓</text><rect x="345" y="323" width="660" height="52" rx="12" fill="#c7dced" stroke="#bccbd8" stroke-width="2"/><text x="1030" y="359" font-size="26" fill="#183047" text-anchor="start">4 kPa</text><text x="65" y="454" font-size="32" fill="#1765ad" text-anchor="start">RH = 2 ÷ 4 × 100% = 50%</text><text x="65" y="496" font-size="23" fill="#183047" text-anchor="start">壓力單位相除抵消；DHT11本例不直接輸出kPa。</text><text x="30" y="589" font-size="26" fill="#ae2842" text-anchor="start">不是空氣體積有50%是水，也不是空氣中水的重量占50%。</text><text x="30" y="643" font-size="24" fill="#183047" text-anchor="start">溫度改變，比較基準也改變；不能拿不同溫度的基準直接套同一比例。</text><text x="30" y="695" font-size="25" fill="#183047" text-anchor="start">50%RH → 60%RH：增加10個百分點。不是增加10 °C。</text></svg>
