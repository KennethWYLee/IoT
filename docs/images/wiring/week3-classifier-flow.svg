<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555"><title>「遮光」是程式解釋，不是ADC直接吐出的物理量</title><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="555" fill="white"/><text x="32" y="53" font-size="32" fill="#183047">「遮光」是程式解釋，不是ADC直接吐出的物理量</text><text x="32" y="100" font-size="25" fill="#183047">資料流程示意：箭頭不是電流。以下數字為教學示例。</text><rect x="32" y="155" width="355" height="170" rx="14" fill="#f3f7fb" stroke="#9fb3c5" stroke-width="2"/><text x="54" y="205" font-size="30" fill="#183047">ADC讀取</text><text x="54" y="265" font-size="29" fill="#183047">raw＝700</text><text x="390" y="252" font-size="29" fill="#183047">→</text><rect x="422" y="155" width="355" height="170" rx="14" fill="#f3f7fb" stroke="#9fb3c5" stroke-width="2"/><text x="444" y="205" font-size="30" fill="#183047">程式比較</text><text x="444" y="265" font-size="29" fill="#183047">700 ＞ 610</text><text x="780" y="252" font-size="29" fill="#183047">→</text><rect x="812" y="155" width="355" height="170" rx="14" fill="#f3f7fb" stroke="#9fb3c5" stroke-width="2"/><text x="834" y="205" font-size="30" fill="#183047">加上文字</text><text x="834" y="265" font-size="29" fill="#183047">SHADE／遮光</text><text x="32" y="390" font-size="27" fill="#183047">真實操作條件 → 先記錄兩組基準 → 訂規則 → 用新資料驗證</text><text x="32" y="452" font-size="27" fill="#ae2842">700在兩組基準中間：雖有暫定標籤，quality仍是suspect。</text><text x="32" y="514" font-size="26" fill="#183047">文字不會增加量測資訊；改變位置或規則，標籤可能失準。</text></svg>
