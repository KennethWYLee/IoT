<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="812" viewBox="0 0 1350 812" role="img" aria-labelledby="title desc"><title id="title">不是從第一次LOW等30 ms：要從最後一次變化算</title><desc id="desc">HIGH LOW波形為邏輯示意，5000到5020五次raw變化，5050接受。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1350" height="812" fill="white"/><text x="32" y="49" font-size="32" fill="#183047" text-anchor="start" font-weight="700">不是從第一次LOW等30 ms：要從最後一次變化算</text><text x="32" y="93" font-size="24" fill="#183047" text-anchor="start" font-weight="400">紙上模型：從5000 ms起觀察；每毫秒讀一次，5020之後持續LOW。</text><text x="35" y="180" font-size="24" fill="#183047" text-anchor="start" font-weight="400">HIGH</text><text x="35" y="235" font-size="24" fill="#183047" text-anchor="start" font-weight="400">LOW</text><path d="M220 173H220V228H322V173H407V228H526V173H560V228H1240" fill="none" stroke="#1765ad" stroke-width="4" stroke-linejoin="round"/><line x1="220" y1="280" x2="220" y2="298" stroke="#53667a" stroke-width="2"/><text x="220" y="321" font-size="22" fill="#183047" text-anchor="middle" font-weight="400">5000</text><line x1="322" y1="280" x2="322" y2="298" stroke="#53667a" stroke-width="2"/><text x="322" y="321" font-size="22" fill="#183047" text-anchor="middle" font-weight="400">5006</text><line x1="407" y1="280" x2="407" y2="298" stroke="#53667a" stroke-width="2"/><text x="407" y="321" font-size="22" fill="#183047" text-anchor="middle" font-weight="400">5011</text><line x1="526" y1="280" x2="526" y2="298" stroke="#53667a" stroke-width="2"/><text x="526" y="321" font-size="22" fill="#183047" text-anchor="middle" font-weight="400">5018</text><line x1="560" y1="280" x2="560" y2="330" stroke="#53667a" stroke-width="2"/><text x="560" y="358" font-size="22" fill="#183047" text-anchor="middle" font-weight="400">5020</text><line x1="1070" y1="280" x2="1070" y2="298" stroke="#53667a" stroke-width="2"/><text x="1070" y="321" font-size="22" fill="#183047" text-anchor="middle" font-weight="400">5050</text><line x1="1240" y1="280" x2="1240" y2="298" stroke="#53667a" stroke-width="2"/><text x="1240" y="321" font-size="22" fill="#183047" text-anchor="middle" font-weight="400">5060</text><line x1="220" y1="283" x2="1240" y2="283" stroke="#53667a" stroke-width="2"/><rect x="560" y="366" width="510" height="68" rx="10" fill="#e8f5ef" stroke="#c6d4e0" stroke-width="2"/><text x="815" y="410" font-size="25" fill="#087768" text-anchor="middle" font-weight="700">最後一段連續30 ms</text><text x="35" y="486" font-size="25" fill="#183047" text-anchor="start" font-weight="400">stable</text><text x="35" y="522" font-size="20" fill="#183047" text-anchor="start" font-weight="400">未接受按下</text><path d="M220 480H1070V535H1240" fill="none" stroke="#087768" stroke-width="4" stroke-linejoin="round"/><text x="1070" y="580" font-size="24" fill="#087768" text-anchor="middle" font-weight="700">5050才接受</text><rect x="28" y="620" width="1290" height="163" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="51" y="665" font-size="25" fill="#183047" text-anchor="start" font-weight="400">raw一共變5次；stable只接受1次按下。5049 − 5020 = 29：還不能接受。</text><text x="51" y="711" font-size="25" fill="#183047" text-anchor="start" font-weight="400">5050 − 5020 = 30：兩條件都成立。5051仍LOW：raw等於stable，不再重複。</text><text x="51" y="756" font-size="24" fill="#183047" text-anchor="start" font-weight="400">若實際loop到5053才檢查，可在5053接受；不是保證固定延遲的精密計時器。</text></svg>
