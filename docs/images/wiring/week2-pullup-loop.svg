<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="855" viewBox="0 0 1380 855" role="img" aria-labelledby="title desc"><title id="title">為何按下變LOW？上拉與GND如何形成路徑？</title><desc id="desc">內部上拉接3.3V，按鈕放開為HIGH，按住接地為LOW，圖不表示晶片精確內部構造。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1380" height="855" fill="white"/><text x="32" y="49" font-size="32" fill="#183047" text-anchor="start" font-weight="700">為何按下變LOW？上拉與GND如何形成路徑？</text><text x="32" y="93" font-size="23" fill="#183047" text-anchor="start" font-weight="400">功能示意：輸入電路在晶片內部使用共同GND；不是照比例畫的板內配線圖。</text><rect x="28" y="126" width="653" height="600" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="53" y="170" font-size="28" fill="#183047" text-anchor="start" font-weight="700">放開：開關開路</text><rect x="46" y="194" width="610" height="274" fill="#eaf4ff" stroke="#1765ad" stroke-dasharray="9 6"/><text x="65" y="229" font-size="23" fill="#1765ad" text-anchor="start" font-weight="400">板上供電與ESP32內部功能</text><text x="218" y="268" font-size="23" fill="#ad2944" text-anchor="middle" font-weight="400">約3.3V</text><line x1="218" y1="280" x2="218" y2="305" stroke="#ad2944" stroke-width="4"/><rect x="193" y="305" width="50" height="62" rx="10" fill="#fff3d8" stroke="#c6d4e0" stroke-width="2"/><text x="256" y="340" font-size="23" fill="#183047" text-anchor="start" font-weight="400">內部上拉電阻</text><line x1="218" y1="367" x2="218" y2="440" stroke="#1765ad" stroke-width="4"/><circle cx="218" cy="407" r="6" fill="#1765ad"/><line x1="218" y1="407" x2="478" y2="407" stroke="#1765ad" stroke-width="4"/><rect x="465" y="277" width="167" height="103" rx="10" fill="#fff" stroke="#c6d4e0" stroke-width="2"/><text x="548" y="315" font-size="23" fill="#183047" text-anchor="middle" font-weight="400">輸入判定</text><text x="548" y="353" font-size="28" fill="#1765ad" text-anchor="middle" font-weight="700">HIGH</text><line x1="478" y1="380" x2="478" y2="407" stroke="#1765ad" stroke-width="4"/><path d="M607 380V679H218" fill="none" stroke="#087768" stroke-width="3" stroke-linejoin="round"/><text x="513" y="630" font-size="20" fill="#087768" text-anchor="start" font-weight="400">內部共同地</text><text x="240" y="495" font-size="22" fill="#1765ad" text-anchor="start" font-weight="400">GPIO → 按鈕</text><line x1="218" y1="440" x2="218" y2="521" stroke="#1765ad" stroke-width="4"/><circle cx="218" cy="521" r="6" fill="#1765ad"/><line x1="218" y1="521" x2="266" y2="571" stroke="#1765ad" stroke-width="4"/><circle cx="218" cy="571" r="6" fill="#1765ad"/><line x1="218" y1="571" x2="218" y2="679" stroke="#087768" stroke-width="4"/><circle cx="218" cy="679" r="6" fill="#087768"/><text x="283" y="594" font-size="22" fill="#183047" text-anchor="start" font-weight="400">斷開，沒有這段通流</text><text x="244" y="670" font-size="23" fill="#087768" text-anchor="start" font-weight="400">外部GND線</text><path d="M218 285H104V320" fill="none" stroke="#ad2944" stroke-width="3" stroke-linejoin="round"/><rect x="61" y="320" width="87" height="103" rx="10" fill="#fff" stroke="#c6d4e0" stroke-width="2"/><text x="104" y="362" font-size="22" fill="#183047" text-anchor="middle" font-weight="400">板上</text><text x="104" y="397" font-size="22" fill="#183047" text-anchor="middle" font-weight="400">供電</text><path d="M218 679H104V423" fill="none" stroke="#087768" stroke-width="3" stroke-linejoin="round"/><text x="55" y="712" font-size="22" fill="#183047" text-anchor="start" font-weight="400">GPIO被上拉維持HIGH；不是GPIO自動供電。</text><rect x="708" y="126" width="653" height="600" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="733" y="170" font-size="28" fill="#183047" text-anchor="start" font-weight="700">按住：開關閉合</text><rect x="726" y="194" width="610" height="274" fill="#eaf4ff" stroke="#1765ad" stroke-dasharray="9 6"/><text x="745" y="229" font-size="23" fill="#1765ad" text-anchor="start" font-weight="400">板上供電與ESP32內部功能</text><text x="898" y="268" font-size="23" fill="#ad2944" text-anchor="middle" font-weight="400">約3.3V</text><line x1="898" y1="280" x2="898" y2="305" stroke="#ad2944" stroke-width="4"/><rect x="873" y="305" width="50" height="62" rx="10" fill="#fff3d8" stroke="#c6d4e0" stroke-width="2"/><text x="936" y="340" font-size="23" fill="#183047" text-anchor="start" font-weight="400">內部上拉電阻</text><line x1="898" y1="367" x2="898" y2="440" stroke="#1765ad" stroke-width="4"/><circle cx="898" cy="407" r="6" fill="#1765ad"/><line x1="898" y1="407" x2="1158" y2="407" stroke="#1765ad" stroke-width="4"/><rect x="1145" y="277" width="167" height="103" rx="10" fill="#fff" stroke="#c6d4e0" stroke-width="2"/><text x="1228" y="315" font-size="23" fill="#183047" text-anchor="middle" font-weight="400">輸入判定</text><text x="1228" y="353" font-size="28" fill="#1765ad" text-anchor="middle" font-weight="700">LOW</text><line x1="1158" y1="380" x2="1158" y2="407" stroke="#1765ad" stroke-width="4"/><path d="M1287 380V679H898" fill="none" stroke="#087768" stroke-width="3" stroke-linejoin="round"/><text x="1193" y="630" font-size="20" fill="#087768" text-anchor="start" font-weight="400">內部共同地</text><text x="920" y="495" font-size="22" fill="#1765ad" text-anchor="start" font-weight="400">GPIO → 按鈕</text><line x1="898" y1="440" x2="898" y2="521" stroke="#1765ad" stroke-width="4"/><circle cx="898" cy="521" r="6" fill="#1765ad"/><line x1="898" y1="521" x2="898" y2="571" stroke="#1765ad" stroke-width="4"/><circle cx="898" cy="571" r="6" fill="#1765ad"/><line x1="898" y1="571" x2="898" y2="679" stroke="#087768" stroke-width="4"/><circle cx="898" cy="679" r="6" fill="#087768"/><text x="963" y="594" font-size="22" fill="#183047" text-anchor="start" font-weight="400">閉合，接回GND</text><text x="924" y="670" font-size="23" fill="#087768" text-anchor="start" font-weight="400">外部GND線</text><path d="M898 285H784V320" fill="none" stroke="#ad2944" stroke-width="3" stroke-linejoin="round"/><rect x="741" y="320" width="87" height="103" rx="10" fill="#fff" stroke="#c6d4e0" stroke-width="2"/><text x="784" y="362" font-size="22" fill="#183047" text-anchor="middle" font-weight="400">板上</text><text x="784" y="397" font-size="22" fill="#183047" text-anchor="middle" font-weight="400">供電</text><path d="M898 679H784V423" fill="none" stroke="#087768" stroke-width="3" stroke-linejoin="round"/><text x="812" y="617" font-size="26" fill="#087768" text-anchor="start" font-weight="400">↑</text><text x="735" y="712" font-size="22" fill="#183047" text-anchor="start" font-weight="400">按鈕支路有小電流；上拉限制電流。</text><text x="32" y="775" font-size="25" fill="#1765ad" text-anchor="start" font-weight="400">true表示「按下」，不表示電壓HIGH；另一支測試輸出GPIO的狀態由程式另行命令。</text><text x="32" y="820" font-size="24" fill="#183047" text-anchor="start" font-weight="400">拿掉按鈕GND線只會中斷該支路，不表示USB供電的整片板子都沒有電流。</text></svg>
