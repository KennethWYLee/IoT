stroke="#183047" stroke-width="4" stroke-linejoin="round"/><text x="1055" y="463" font-size="23" fill="#183047" text-anchor="start" font-weight="400">按鈕內部A組</text><text x="1055" y="603" font-size="23" fill="#183047" text-anchor="start" font-weight="400">按鈕內部B組</text><text x="1055" y="558" font-size="23" fill="#1765ad" text-anchor="start" font-weight="400">按住才接A、B</text><text x="877" y="400" font-size="22" fill="#53667a" text-anchor="start" font-weight="400">中央溝槽</text><text x="1055" y="710" font-size="22" fill="#183047" text-anchor="start" font-weight="400">e27↔f27原本同組</text><text x="1055" y="749" font-size="22" fill="#183047" text-anchor="start" font-weight="400">e29↔f29原本同組</text><text x="32" y="726" font-size="23" fill="#ad2944" text-anchor="start" font-weight="400">線交叉的拱橋處不連接；實際不要讓外露金屬相碰。</text><text x="32" y="762" font-size="24" fill="#183047" text-anchor="start" font-weight="400">a29改b29：仍同節點；改a28：不同節點。右半部f／j本次不另外接線。</text><text x="32" y="808" font-size="24" fill="#ad2944" text-anchor="start" font-weight="400">第20列TPO不可接第22列TPG。圖只畫用到的列，所有插線與通斷檢查先斷電。</text></svg>
