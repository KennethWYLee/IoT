<svg xmlns="http://www.w3.org/2000/svg" width="1015" height="873" viewBox="0 0 1015 873" role="img" aria-labelledby="title desc">
<title id="title">讀到3.0 V，怎麼算出3 mA？</title><desc id="desc">單電阻閉合迴路與並聯電壓表；A-B電壓和相同電阻才可代入歐姆定律。示意非實測。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style>
<rect width="1015" height="873" fill="white"/><text x="32" y="48" font-size="32" fill="#183047" text-anchor="start" font-weight="700">讀到3.0 V，怎麼算出3 mA？</text><text x="32" y="92" font-size="23" fill="#183047" text-anchor="start" font-weight="400">理想紙上例子：只有一顆1 kΩ電阻；忽略電表分流。不新增實驗、不用電流檔。</text><text x="32" y="139" font-size="25" fill="#1765ad" text-anchor="start" font-weight="700">電壓表另外跨在A、B兩點；不是串進主路徑。</text><rect x="56" y="314" width="170" height="173" rx="12" fill="#edf4fb" stroke="#ccd7e1" stroke-width="2"/><text x="141" y="359" font-size="25" fill="#183047" text-anchor="middle" font-weight="700">理想電源</text><text x="141" y="404" font-size="25" fill="#183047" text-anchor="middle" font-weight="400">兩端3.0 V</text><text x="141" y="450" font-size="22" fill="#52657a" text-anchor="middle" font-weight="400">維持電位差</text><path d="M141 314V229H484V339" fill="none" stroke="#ae2842" stroke-width="5" stroke-linejoin="round"/><path d="M484 433V572H141V487" fill="none" stroke="#087768" stroke-width="5" stroke-linejoin="round"/><rect x="459" y="339" width="50" height="94" rx="3" fill="#fff5d9" stroke="#ad914f" stroke-width="2"/><text x="370" y="373" font-size="26" fill="#183047" text-anchor="end" font-weight="700">1 kΩ</text><text x="370" y="411" font-size="23" fill="#183047" text-anchor="end" font-weight="400">1000 Ω</text><circle cx="484" cy="229" r="8" fill="#ae2842"/><circle cx="484" cy="572" r="8" fill="#087768"/><text x="463" y="198" font-size="24" fill="#ae2842" text-anchor="end" font-weight="400">A：相對B為+3.0 V</text><text x="464" y="614" font-size="24" fill="#087768" text-anchor="end" font-weight="400">B：GND，選作0 V</text><text x="275" y="267" font-size="24" fill="#087768" text-anchor="start" font-weight="400">→ 主路徑</text><text x="519" y="493" font-size="23" fill="#087768" text-anchor="start" font-weight="400">↓ 3 mA（計算）</text><text x="270" y="552" font-size="24" fill="#087768" text-anchor="start" font-weight="400">← 回程</text><path d="M484 229H824V331" fill="none" stroke="#ae2842" stroke-width="4" stroke-linejoin="round"/><path d="M484 572H824V465" fill="none" stroke="#183047" stroke-width="4" stroke-linejoin="round"/><text x="649" y="204" font-size="24" fill="#ae2842" text-anchor="start" font-weight="400">紅表筆：接A</text><text x="653" y="610" font-size="24" fill="#183047" text-anchor="start" font-weight="400">黑表筆：接B</text><rect x="691" y="331" width="267" height="134" rx="12" fill="#e8eef3" stroke="#74899d" stroke-width="2"/><rect x="710" y="350" width="228" height="60" rx="4" fill="#e5ecd8" stroke="#849271" stroke-width="2"/><text x="824" y="393" font-size="38" fill="#183047" text-anchor="middle" font-weight="700">3.00</text><text x="824" y="447" font-size="21" fill="#1765ad" text-anchor="middle" font-weight="400">V⎓ 20（不是A檔）</text><rect x="32" y="659" width="951" height="181" rx="12" fill="#f3f7fb" stroke="#ccd7e1" stroke-width="2"/><text x="55" y="702" font-size="26" fill="#1765ad" text-anchor="start" font-weight="700">電表回答：A比B高3.00 V。</text><text x="55" y="750" font-size="25" fill="#183047" text-anchor="start" font-weight="400">計算回答：I＝3.0 V ÷ 1000 Ω＝0.003 A＝3 mA。</text><text x="55" y="797" font-size="24" fill="#ae2842" text-anchor="start" font-weight="400">兩個數字都有3，但量不同、單位不同；不是電表讀到3 mA。</text>
</svg>
