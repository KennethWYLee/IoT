<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="710" viewBox="0 0 1230 710" role="img" aria-labelledby="title desc">
<title id="title">電壓像尺：先說清楚在比較哪兩個位置</title><desc id="desc">三種表筆方向比較。示意數字非新增實測，所有移線先斷電。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style>
<rect width="1230" height="710" fill="white"/><text x="32" y="48" font-size="32" fill="#183047" text-anchor="start" font-weight="700">電壓像尺：先說清楚在比較哪兩個位置</text><text x="32" y="90" font-size="23" fill="#183047" text-anchor="start" font-weight="400">直流電壓檔：顯示值＝紅表筆所在電位 − 黑表筆所在電位。以下為概念例子。</text><rect x="28" y="123" width="378" height="423" rx="12" fill="#f3f7fb" stroke="#ccd7e1" stroke-width="2"/><text x="48" y="165" font-size="26" fill="#183047" text-anchor="start" font-weight="700">正常方向</text><text x="50" y="218" font-size="24" fill="#ae2842" text-anchor="start" font-weight="400">紅表筆</text><text x="50" y="257" font-size="25" fill="#183047" text-anchor="start" font-weight="400">第6列：3V3</text><line x1="52" y1="279" x2="382" y2="279" stroke="#cfdae4" stroke-width="2"/><text x="50" y="324" font-size="24" fill="#183047" text-anchor="start" font-weight="400">黑表筆</text><text x="50" y="364" font-size="25" fill="#183047" text-anchor="start" font-weight="400">第3列：GND</text><rect x="44" y="408" width="346" height="102" rx="12" fill="#eaf4ff" stroke="#90b7db" stroke-width="2"/><text x="217" y="470" font-size="26" fill="#1765ad" text-anchor="middle" font-weight="700">3.3 − 0 ≈ +3.3 V</text><rect x="425" y="123" width="378" height="423" rx="12" fill="#f3f7fb" stroke="#ccd7e1" stroke-width="2"/><text x="445" y="165" font-size="26" fill="#183047" text-anchor="start" font-weight="700">交換表筆方向</text><text x="447" y="218" font-size="24" fill="#ae2842" text-anchor="start" font-weight="400">紅表筆</text><text x="447" y="257" font-size="25" fill="#183047" text-anchor="start" font-weight="400">第3列：GND</text><line x1="449" y1="279" x2="779" y2="279" stroke="#cfdae4" stroke-width="2"/><text x="447" y="324" font-size="24" fill="#183047" text-anchor="start" font-weight="400">黑表筆</text><text x="447" y="364" font-size="25" fill="#183047" text-anchor="start" font-weight="400">第6列：3V3</text><rect x="441" y="408" width="346" height="102" rx="12" fill="#eaf4ff" stroke="#90b7db" stroke-width="2"/><text x="614" y="470" font-size="26" fill="#1765ad" text-anchor="middle" font-weight="700">0 − 3.3 ≈ −3.3 V</text><rect x="822" y="123" width="378" height="423" rx="12" fill="#f3f7fb" stroke="#ccd7e1" stroke-width="2"/><text x="842" y="165" font-size="26" fill="#183047" text-anchor="start" font-weight="700">量同一節點</text><text x="844" y="218" font-size="24" fill="#ae2842" text-anchor="start" font-weight="400">紅表筆</text><text x="844" y="257" font-size="25" fill="#183047" text-anchor="start" font-weight="400">第6列：3V3</text><line x1="846" y1="279" x2="1176" y2="279" stroke="#cfdae4" stroke-width="2"/><text x="844" y="324" font-size="24" fill="#183047" text-anchor="start" font-weight="400">黑表筆</text><text x="844" y="364" font-size="25" fill="#183047" text-anchor="start" font-weight="400">第6列：3V3</text><rect x="838" y="408" width="346" height="102" rx="12" fill="#eaf4ff" stroke="#90b7db" stroke-width="2"/><text x="1011" y="470" font-size="26" fill="#1765ad" text-anchor="middle" font-weight="700">3.3 − 3.3 ≈ 0 V</text><text x="32" y="591" font-size="24" fill="#183047" text-anchor="start" font-weight="400">a6～e6是同一節點的入口；a3～e3也是。第6列與第3列不是同一節點。</text><text x="32" y="634" font-size="24" fill="#ae2842" text-anchor="start" font-weight="400">電表用內部高輸入電阻量測，不是用普通導線直接連接第6列與第3列。</text><text x="32" y="677" font-size="24" fill="#183047" text-anchor="start" font-weight="400">同點讀到0 V，不代表整片板子沒電；負號也不表示應交換板上的供電線。</text>
</svg>
