<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="735" viewBox="0 0 1200 735" role="img"><title>故障注入與恢復：命令不等於結果</title><desc>不拔帶電線；軟體注入必須標記來源，不能冒充實體sensor故障。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="735" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">故障注入與恢復：命令不等於結果</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">不拔帶電線；軟體注入必須標記來源，不能冒充實體sensor故障。</text><rect x="25" y="150" width="375" height="376" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="45" y="198" font-size="27" fill="#1765ad" text-anchor="start">真實模式</text><text x="45" y="260" font-size="24" fill="#183047" text-anchor="start">source=hardware</text><text x="45" y="329" font-size="29" fill="#183047" text-anchor="start">25 °C / 55%RH</text><text x="45" y="397" font-size="24" fill="#183047" text-anchor="start">先保存真實起點</text><text x="45" y="479" font-size="24" fill="#087768" text-anchor="start">結果仍須檢查</text><rect x="418" y="150" width="375" height="376" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="438" y="198" font-size="27" fill="#1765ad" text-anchor="start">輸入 f 後等待</text><text x="438" y="260" font-size="24" fill="#183047" text-anchor="start">source=injected</text><text x="438" y="329" font-size="29" fill="#183047" text-anchor="start">NaN / NaN</text><text x="438" y="397" font-size="24" fill="#183047" text-anchor="start">略過硬體讀取</text><text x="438" y="479" font-size="19" fill="#ae2842" text-anchor="start">invalid / injected_read_failed</text><rect x="811" y="150" width="375" height="376" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="831" y="198" font-size="27" fill="#1765ad" text-anchor="start">輸入 r 後等待</text><text x="831" y="260" font-size="24" fill="#183047" text-anchor="start">source=hardware</text><text x="831" y="329" font-size="29" fill="#183047" text-anchor="start">26 °C / 56%RH</text><text x="831" y="397" font-size="24" fill="#183047" text-anchor="start">要看到結果才談恢復</text><text x="831" y="479" font-size="24" fill="#087768" text-anchor="start">結果仍須檢查</text><text x="30" y="581" font-size="24" fill="#183047" text-anchor="start">切模式後等2500 ms；sample不中斷計數，第一筆恢復不跨缺口比突變。</text><text x="30" y="633" font-size="24" fill="#ae2842" text-anchor="start">r代表恢復「呼叫硬體」，不是保證成功。若仍NaN，記錄真實讀取失敗。</text><text x="30" y="686" font-size="24" fill="#183047" text-anchor="start">全部數字為示例。注入成功只驗證缺值處理，不能證明斷線偵測已測過。</text></svg>
