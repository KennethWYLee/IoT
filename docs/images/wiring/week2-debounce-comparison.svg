<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="1050" viewBox="0 0 1350 1050" role="img" aria-labelledby="title desc"><title id="title">同一組輸入：等待越久，不一定越好</title><desc id="desc">0 10 30 100ms對同一段合成raw的接受結果，含一次50ms短按。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1350" height="1050" fill="white"/><text x="32" y="49" font-size="32" fill="#183047" text-anchor="start" font-weight="700">同一組輸入：等待越久，不一定越好</text><text x="32" y="94" font-size="24" fill="#183047" text-anchor="start" font-weight="400">模擬條件：同一段raw、每毫秒輪詢、忽略Serial耗時；不是實機按鈕波形。</text><text x="36" y="147" font-size="22" fill="#183047" text-anchor="start" font-weight="400">第一段含短暫反彈</text><text x="867" y="147" font-size="22" fill="#ad2944" text-anchor="start" font-weight="400">第二次：短按50 ms</text><text x="32" y="205" font-size="26" fill="#183047" text-anchor="start" font-weight="700">raw輸入</text><path d="M335 180H335V235H339.74V180H347.64V235H651V180H967V235H1046V180H1314.6" fill="none" stroke="#1765ad" stroke-width="4" stroke-linejoin="round"/><text x="32" y="312" font-size="26" fill="#087768" text-anchor="start" font-weight="700">0 ms → stable</text><text x="32" y="354" font-size="23" fill="#183047" text-anchor="start" font-weight="400">3按／3放</text><path d="M335 290H335V345H339.74V290H347.64V345H651V290H967V345H1046V290H1314.6" fill="none" stroke="#087768" stroke-width="4" stroke-linejoin="round"/><text x="32" y="440" font-size="26" fill="#087768" text-anchor="start" font-weight="700">10 ms → stable</text><text x="32" y="482" font-size="23" fill="#183047" text-anchor="start" font-weight="400">2按／2放</text><path d="M335 418H363.44V473H666.8V418H982.8000000000001V473H1061.8000000000002V418H1314.6" fill="none" stroke="#087768" stroke-width="4" stroke-linejoin="round"/><text x="32" y="568" font-size="26" fill="#087768" text-anchor="start" font-weight="700">30 ms → stable</text><text x="32" y="610" font-size="23" fill="#183047" text-anchor="start" font-weight="400">2按／2放</text><path d="M335 546H395.04V601H698.4000000000001V546H1014.4V601H1093.4V546H1314.6" fill="none" stroke="#087768" stroke-width="4" stroke-linejoin="round"/><text x="32" y="696" font-size="26" fill="#087768" text-anchor="start" font-weight="700">100 ms → stable</text><text x="32" y="738" font-size="23" fill="#183047" text-anchor="start" font-weight="400">1按／1放</text><path d="M335 674H505.64V729H809V674H1314.6" fill="none" stroke="#087768" stroke-width="4" stroke-linejoin="round"/><line x1="335" y1="819" x2="335" y2="835" stroke="#53667a" stroke-width="2"/><text x="335" y="869" font-size="23" fill="#183047" text-anchor="middle" font-weight="400">1000</text><line x1="651" y1="819" x2="651" y2="835" stroke="#53667a" stroke-width="2"/><text x="651" y="869" font-size="23" fill="#183047" text-anchor="middle" font-weight="400">1200</text><line x1="967" y1="819" x2="967" y2="835" stroke="#53667a" stroke-width="2"/><text x="967" y="869" font-size="23" fill="#183047" text-anchor="middle" font-weight="400">1400</text><line x1="1046" y1="819" x2="1046" y2="835" stroke="#53667a" stroke-width="2"/><text x="1046" y="869" font-size="23" fill="#183047" text-anchor="middle" font-weight="400">1450</text><line x1="1314.6" y1="819" x2="1314.6" y2="835" stroke="#53667a" stroke-width="2"/><text x="1314.6" y="869" font-size="23" fill="#183047" text-anchor="middle" font-weight="400">1620</text><text x="37" y="867" font-size="23" fill="#183047" text-anchor="start" font-weight="400">time_ms</text><text x="32" y="929" font-size="24" fill="#183047" text-anchor="start" font-weight="400">每條線上方＝放開、下方＝按下；線高低只是邏輯示意，不是電表電壓。</text><text x="32" y="972" font-size="24" fill="#ad2944" text-anchor="start" font-weight="400">100 ms漏掉50 ms短按；0 ms接受了第一段反彈。這組數據不能證明30 ms永遠最好。</text><text x="32" y="1014" font-size="23" fill="#183047" text-anchor="start" font-weight="400">1000～1008反彈在此全長圖很窄，精確事件時間請對照正文表格。</text></svg>
