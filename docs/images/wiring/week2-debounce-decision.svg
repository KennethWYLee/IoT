<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="843" viewBox="0 0 1350 843" role="img" aria-labelledby="title desc"><title id="title">去抖判斷：重設起點，再檢查兩個條件</title><desc id="desc">對應本課&gt;=比較與raw stable邏輯，不直接照搬官方5V外部下拉接線。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1350" height="843" fill="white"/><text x="32" y="49" font-size="32" fill="#183047" text-anchor="start" font-weight="700">去抖判斷：重設起點，再檢查兩個條件</text><text x="32" y="94" font-size="24" fill="#183047" text-anchor="start" font-weight="400">每次loop仍會讀輸入；DEBOUNCE_MS不是每次loop都delay同樣時間。</text><rect x="32" y="135" width="1285" height="109" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="57" y="176" font-size="28" fill="#1765ad" text-anchor="start" font-weight="700">讀取raw與now</text><text x="57" y="217" font-size="25" fill="#183047" text-anchor="start" font-weight="400">rawPressed = (digitalRead(PIN_BUTTON) == LOW)</text><text x="657" y="278" font-size="31" fill="#087768" text-anchor="middle" font-weight="400">↓</text><rect x="32" y="280" width="1285" height="109" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="57" y="321" font-size="28" fill="#1765ad" text-anchor="start" font-weight="700">raw與前一次不同？</text><text x="57" y="362" font-size="25" fill="#183047" text-anchor="start" font-weight="400">是：保存新raw，changedAtMs = now；否：保留原起點</text><text x="657" y="423" font-size="31" fill="#087768" text-anchor="middle" font-weight="400">↓</text><rect x="32" y="425" width="1285" height="109" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="57" y="466" font-size="28" fill="#1765ad" text-anchor="start" font-weight="700">同時滿足兩個條件？</text><text x="57" y="507" font-size="25" fill="#183047" text-anchor="start" font-weight="400">now − changedAtMs ≥ DEBOUNCE_MS，而且 raw ≠ stable</text><text x="657" y="568" font-size="31" fill="#087768" text-anchor="middle" font-weight="400">↓</text><rect x="32" y="570" width="1285" height="109" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="57" y="611" font-size="28" fill="#1765ad" text-anchor="start" font-weight="700">符合才接受一次</text><text x="57" y="652" font-size="25" fill="#183047" text-anchor="start" font-weight="400">更新stable、輸出命令及計數；不符合則保持原狀</text><text x="32" y="768" font-size="25" fill="#183047" text-anchor="start" font-weight="400">然後回到下一次loop。一直按住時raw等於stable，不會每輪重複增加press。</text><text x="32" y="810" font-size="24" fill="#ad2944" text-anchor="start" font-weight="400">這是邏輯流程，不是接線圖；Serial列印仍可能增加輪詢間隔。</text></svg>
