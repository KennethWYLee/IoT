<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="785" viewBox="0 0 1200 785" role="img"><title>狀態決定能不能開始、計分或復原</title><desc>結算後停止指針脈波，外部電源仍須人工OFF；此圖不是供電控制電路。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="785" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">狀態決定能不能開始、計分或復原</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">結算後停止指針脈波，外部電源仍須人工OFF；此圖不是供電控制電路。</text><rect x="35" y="215" width="235" height="150" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="152" y="269" font-size="30" fill="#1765ad" text-anchor="middle">IDLE</text><text x="152" y="322" font-size="23" fill="#183047" text-anchor="middle">新Start + 先備</text><rect x="425" y="215" width="260" height="150" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="555" y="275" font-size="31" fill="#087768" text-anchor="middle">RUNNING</text><text x="555" y="325" font-size="25" fill="#183047" text-anchor="middle">時間／計分</text><line x1="275" y1="285" x2="420" y2="285" stroke="#1765ad" stroke-width="3"/><path d="M408.5914266954251,278.7674679981454 L420,285 L408.5914266954251,291.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="870" y="150" width="300" height="150" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="1020" y="205" font-size="29" fill="#087768" text-anchor="middle">SUCCESS</text><text x="1020" y="260" font-size="24" fill="#183047" text-anchor="middle">期限前6 + Finish</text><line x1="690" y1="290" x2="865" y2="225" stroke="#087768" stroke-width="3"/><path d="M852.1352313783462,223.12977853950034 L865,225 L856.4753987550849,234.81484455379666" fill="none" stroke="#087768" stroke-width="3"/><rect x="870" y="340" width="300" height="150" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="1020" y="395" font-size="29" fill="#ae2842" text-anchor="middle">FAILED</text><text x="1020" y="450" font-size="24" fill="#183047" text-anchor="middle">不足6結束／到期</text><line x1="690" y1="290" x2="865" y2="415" stroke="#ae2842" stroke-width="3"/><path d="M859.3390476864063,403.2972815592608 L865,415 L852.0938764002974,413.44052135981326" fill="none" stroke="#ae2842" stroke-width="3"/><rect x="870" y="530" width="300" height="150" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="1020" y="585" font-size="29" fill="#ae2842" text-anchor="middle">ABORTED</text><text x="1020" y="640" font-size="24" fill="#183047" text-anchor="middle">人工／裝置問題</text><line x1="690" y1="290" x2="865" y2="605" stroke="#ae2842" stroke-width="3"/><path d="M864.9077202178815,592.0003275255947 L865,605 L854.0112938217184,598.0538977456853" fill="none" stroke="#ae2842" stroke-width="3"/><rect x="35" y="480" width="695" height="200" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="65" y="530" font-size="28" fill="#183047" text-anchor="start">結果凍結，不再計分或重播聲音</text><text x="65" y="588" font-size="24" fill="#183047" text-anchor="start">放開＋排除原因；ABORTED先c，再z</text><text x="65" y="641" font-size="24" fill="#ae2842" text-anchor="start">z只回IDLE；階段2重新OFF → a → ON</text><text x="35" y="739" font-size="24" fill="#183047" text-anchor="start">雙鍵中止也能從待機進入ABORTED；實體RST不恢復上一局動作。</text></svg>
