<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>數字、基本有效與可用判斷，不是同一件事</title><desc>本課程式政策；不是DHT11原廠性能規格或完整故障診斷。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="850" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">數字、基本有效與可用判斷，不是同一件事</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">本課程式政策；不是DHT11原廠性能規格或完整故障診斷。</text><rect x="30" y="128" width="1140" height="98" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="50" y="168" font-size="26" fill="#1765ad" text-anchor="start">兩欄都是有限數字？</text><text x="50" y="206" font-size="24" fill="#ae2842" text-anchor="start">否 → invalid / read_failed；注入時為injected_read_failed</text><rect x="30" y="245" width="1140" height="98" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="50" y="285" font-size="26" fill="#1765ad" text-anchor="start">RH在0～100之內？</text><text x="50" y="323" font-size="24" fill="#ae2842" text-anchor="start">否 → invalid / rh_out_of_bounds</text><rect x="30" y="362" width="1140" height="98" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="50" y="402" font-size="26" fill="#1765ad" text-anchor="start">溫度在教室政策10～40 °C？</text><text x="50" y="440" font-size="24" fill="#ae2842" text-anchor="start">否 → suspect / outside_classroom_policy</text><rect x="30" y="479" width="1140" height="98" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="50" y="519" font-size="26" fill="#1765ad" text-anchor="start">符合短時突變規則？</text><text x="50" y="557" font-size="24" fill="#ae2842" text-anchor="start">是 → suspect / abrupt_change</text><rect x="30" y="596" width="1140" height="98" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="50" y="636" font-size="26" fill="#1765ad" text-anchor="start">前面都未命中</text><text x="50" y="674" font-size="24" fill="#087768" text-anchor="start">usable / basic_checks_passed</text><text x="30" y="760" font-size="24" fill="#183047" text-anchor="start">依序檢查：只印第一個命中原因。第3、4層的suspect仍是valid=true。</text><text x="30" y="811" font-size="26" fill="#ae2842" text-anchor="start">usable只代表通過本程式檢查；不是已校正，更不是永遠可信。</text></svg>
