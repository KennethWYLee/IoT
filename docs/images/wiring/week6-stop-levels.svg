<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>「停了」要說清楚停的是哪一層</title><desc>未量測停止反應時間，不宣稱立即停止或硬體電力已切除。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="700" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">「停了」要說清楚停的是哪一層</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">未量測停止反應時間，不宣稱立即停止或硬體電力已切除。</text><rect x="30" y="155" width="374" height="380" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="217" y="215" font-size="31" fill="#1765ad" text-anchor="middle">保持位置</text><text x="217" y="300" font-size="26" fill="#183047" text-anchor="middle">脈波持續</text><text x="217" y="372" font-size="25" fill="#183047" text-anchor="middle">外部電源ON</text><text x="217" y="460" font-size="25" fill="#1765ad" text-anchor="middle">可能仍用電與修正</text><rect x="424" y="155" width="374" height="380" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="611" y="215" font-size="31" fill="#087768" text-anchor="middle">停止脈波</text><text x="611" y="300" font-size="26" fill="#183047" text-anchor="middle">detach／signal LOW</text><text x="611" y="372" font-size="25" fill="#183047" text-anchor="middle">外部電源可能ON</text><text x="611" y="460" font-size="25" fill="#087768" text-anchor="middle">可能失去保持力</text><rect x="818" y="155" width="374" height="380" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="1005" y="215" font-size="31" fill="#ae2842" text-anchor="middle">切外部電源</text><text x="1005" y="300" font-size="26" fill="#183047" text-anchor="middle">不再供應工作電力</text><text x="1005" y="372" font-size="25" fill="#183047" text-anchor="middle">USB仍可能供板卡</text><text x="1005" y="460" font-size="25" fill="#ae2842" text-anchor="middle">改線還要拔USB</text><text x="30" y="595" font-size="25" fill="#183047" text-anchor="start">STOP → ABORTED鎖定；放開並clear、reset只回DISARMED，不自動轉動。</text><text x="30" y="649" font-size="24" fill="#ae2842" text-anchor="start">軟體停止不等於切電，也不是經認證的急停。異常先切外部電源，再拔USB。</text></svg>
