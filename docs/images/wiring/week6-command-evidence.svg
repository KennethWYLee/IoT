<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img"><title>資料一致，不等於兩個實體輸出都正常</title><desc>110是計算示例；同一次資料、時間與實物觀察才可以互相比對。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="710" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">資料一致，不等於兩個實體輸出都正常</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">110是計算示例；同一次資料、時間與實物觀察才可以互相比對。</text><rect x="35" y="175" width="290" height="245" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="180" y="240" font-size="28" fill="#1765ad" text-anchor="middle">同一份count=4</text><text x="180" y="310" font-size="26" fill="#183047" text-anchor="middle">程式中的資料</text><rect x="685" y="155" width="475" height="175" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="920" y="213" font-size="28" fill="#1765ad" text-anchor="middle">OLED：COUNT 4/6</text><text x="920" y="280" font-size="24" fill="#ae2842" text-anchor="middle">傳送命令 ≠ 像素已正確顯示</text><rect x="685" y="380" width="475" height="215" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="920" y="438" font-size="25" fill="#087768" text-anchor="middle">映射：angle_command=110</text><text x="920" y="494" font-size="26" fill="#183047" text-anchor="middle">脈波 → 舵機 → 紙指針</text><text x="920" y="553" font-size="26" fill="#ae2842" text-anchor="middle">命令 ≠ 實測110度</text><line x1="330" y1="240" x2="680" y2="240" stroke="#1765ad" stroke-width="3"/><path d="M668.5914266954252,233.76746799814535 L680,240 L668.5914266954252,246.23253200185465" fill="none" stroke="#1765ad" stroke-width="3"/><line x1="330" y1="350" x2="680" y2="450" stroke="#087768" stroke-width="3"/><path d="M670.7425917804414,440.87309509984624 L680,450 L667.3181753380295,452.8585526482883" fill="none" stroke="#087768" stroke-width="3"/><text x="35" y="660" font-size="25" fill="#183047" text-anchor="start">position_measured=false：本程式沒有讀回真正角度；必須另看實物。</text></svg>
