<header><h1>Week7 Q1～Q4 動畫總覽</h1><nav><a href="#q1">Q1 環境看板</a><a href="#q2">Q2 開啟紀錄</a><a href="#q3">Q3 提示旗</a><a href="#q4">Q4 保留與確認</a></nav><p>先依 Ans 完成接線與實物核對。教學模擬，不是實物錄影；箱蓋用手開合，舵機只帶輕紙旗。</p></header>
<main>
<section id="q1"><h2>Q1．包裹環境看板</h2><p>只看目前光線、溫度與濕度，不保存或警報。</p><img src="week7_q1.gif" alt="Q1 左邊完整步驟，右邊目前紙箱環境讀值"></section>
<section id="q2"><h2>Q2．包裹開啟紀錄器</h2><p>持續開著只算一次；再關箱、再開箱才增加。</p><img src="week7_q2.gif" alt="Q2 左邊完整步驟，右邊紙箱與開啟次數"></section>
<section id="q3"><h2>Q3．開箱提示旗</h2><p>開箱升旗、關箱降旗。停止後仍需人工關外接電源。</p><img src="week7_q3.gif" alt="Q3 左邊完整步驟，右邊紙旗、紙箱、電源和 STOP"></section>
<section id="q4"><h2>Q4．異常保留與人工確認</h2><p>關箱後仍紅燈、升旗；關箱穩定後按鈕確認才解除。</p><img src="week7_q4.gif" alt="Q4 左邊完整步驟，右邊目前狀態與待確認警示"></section>
</main>
