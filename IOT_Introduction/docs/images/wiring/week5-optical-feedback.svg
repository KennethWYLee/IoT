<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img"><title>輸出的燈光，可能反過來改變輸入</title><desc>桌面布局示意，非實際尺寸或已完成的無干擾測試。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="715" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">輸出的燈光，可能反過來改變輸入</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">桌面布局示意，非實際尺寸或已完成的無干擾測試。</text><rect x="40" y="155" width="1120" height="410" rx="12" fill="#faf8ed" stroke="#bacbd7" stroke-width="2"/><rect x="95" y="225" width="250" height="115" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="220" y="292" font-size="29" fill="#1765ad" text-anchor="middle">RGB提示燈</text><rect x="825" y="225" width="270" height="115" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="960" y="292" font-size="29" fill="#087768" text-anchor="middle">KY手勢區</text><line x1="360" y1="282" x2="800" y2="282" stroke="#ae2842" stroke-width="3"/><path d="M788.5914266954252,275.7674679981454 L800,282 L788.5914266954252,288.2325320018546" fill="none" stroke="#ae2842" stroke-width="3"/><text x="475" y="245" font-size="25" fill="#ae2842" text-anchor="middle">可能的光路</text><line x1="660" y1="178" x2="660" y2="379" stroke="#183047" stroke-width="12"/><text x="590" y="418" font-size="24" fill="#183047" text-anchor="middle">調整距離／方向，或放不遮住KY的隔板</text><rect x="400" y="440" width="380" height="85" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="590" y="493" font-size="26" fill="#1765ad" text-anchor="middle">OLED放在玩家可見處</text><text x="30" y="620" font-size="25" fill="#183047" text-anchor="start">固定室內光、KY位置與方向，不遮光；只改RGB：關／紅／綠。</text><text x="30" y="669" font-size="25" fill="#ae2842" text-anchor="start">比較raw區間，再調整一項布局。沒有跨門檻只支持這次環境。</text></svg>
