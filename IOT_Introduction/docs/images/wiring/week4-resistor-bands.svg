<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><title>色環表示標稱阻值，不是當下量測值</title><desc>教學示意，非本包電阻實拍；四色／五色環的讀法不能混用。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="800" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">色環表示標稱阻值，不是當下量測值</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">教學示意，非本包電阻實拍；四色／五色環的讀法不能混用。</text><rect x="25" y="125" width="1150" height="133" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="45" y="161" font-size="26" fill="#1765ad" text-anchor="start">四環 220 Ω ±5%</text><line x1="60" y1="211" x2="410" y2="211" stroke="#52657a" stroke-width="3"/><rect x="95" y="181" width="270" height="58" rx="12" fill="#f7e4b4" stroke="#bccbd8" stroke-width="2"/><rect x="112" y="182" width="17" height="56" fill="#df3427"/><rect x="151" y="182" width="17" height="56" fill="#df3427"/><rect x="190" y="182" width="17" height="56" fill="#8b4d22"/><rect x="259" y="182" width="17" height="56" fill="#c9a43b"/><text x="450" y="214" font-size="26" fill="#183047" text-anchor="start">2、2 → 22 × 10 Ω；金色±5%</text><rect x="25" y="275" width="1150" height="133" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="45" y="311" font-size="26" fill="#1765ad" text-anchor="start">四環 330 Ω ±5%</text><line x1="60" y1="361" x2="410" y2="361" stroke="#52657a" stroke-width="3"/><rect x="95" y="331" width="270" height="58" rx="12" fill="#f7e4b4" stroke="#bccbd8" stroke-width="2"/><rect x="112" y="332" width="17" height="56" fill="#ef8720"/><rect x="151" y="332" width="17" height="56" fill="#ef8720"/><rect x="190" y="332" width="17" height="56" fill="#8b4d22"/><rect x="259" y="332" width="17" height="56" fill="#c9a43b"/><text x="450" y="364" font-size="26" fill="#183047" text-anchor="start">3、3 → 33 × 10 Ω；金色±5%</text><rect x="25" y="425" width="1150" height="133" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="45" y="461" font-size="26" fill="#1765ad" text-anchor="start">五環 220 Ω ±1%</text><line x1="60" y1="511" x2="410" y2="511" stroke="#52657a" stroke-width="3"/><rect x="95" y="481" width="270" height="58" rx="12" fill="#f7e4b4" stroke="#bccbd8" stroke-width="2"/><rect x="112" y="482" width="17" height="56" fill="#df3427"/><rect x="151" y="482" width="17" height="56" fill="#df3427"/><rect x="190" y="482" width="17" height="56" fill="#151515"/><rect x="229" y="482" width="17" height="56" fill="#151515"/><rect x="298" y="482" width="17" height="56" fill="#8b4d22"/><text x="450" y="514" font-size="26" fill="#183047" text-anchor="start">2、2、0 → 220 × 1 Ω；棕色±1%</text><rect x="25" y="575" width="1150" height="133" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="45" y="611" font-size="26" fill="#1765ad" text-anchor="start">五環 330 Ω ±1%</text><line x1="60" y1="661" x2="410" y2="661" stroke="#52657a" stroke-width="3"/><rect x="95" y="631" width="270" height="58" rx="12" fill="#f7e4b4" stroke="#bccbd8" stroke-width="2"/><rect x="112" y="632" width="17" height="56" fill="#ef8720"/><rect x="151" y="632" width="17" height="56" fill="#ef8720"/><rect x="190" y="632" width="17" height="56" fill="#151515"/><rect x="229" y="632" width="17" height="56" fill="#151515"/><rect x="298" y="632" width="17" height="56" fill="#8b4d22"/><text x="450" y="664" font-size="26" fill="#183047" text-anchor="start">3、3、0 → 330 × 1 Ω；棕色±1%</text><text x="30" y="767" font-size="24" fill="#ae2842" text-anchor="start">由讀取端向容差環讀；沒有確定方向或色環數時，先查包裝與規格。</text></svg>
