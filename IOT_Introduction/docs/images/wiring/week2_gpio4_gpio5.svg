<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Week 2 ESP32-S3 profile input and test-output wiring</title>
  <desc id="desc">The verified input GPIO connects through a push button to ground. The verified test-output GPIO connects only to TPO. Ground also connects to TPG. No 5 volt connection is used.</desc>
  <defs>
    <style>
      .title { font: 700 34px system-ui, sans-serif; fill: #172033; }
      .subtitle { font: 600 23px system-ui, sans-serif; fill: #334155; }
      .label { font: 600 22px system-ui, sans-serif; fill: #172033; }
      .small { font: 18px system-ui, sans-serif; fill: #475569; }
      .pin { font: 700 20px ui-monospace, monospace; fill: white; }
      .wire4 { stroke: #2563eb; stroke-width: 8; fill: none; }
      .wire5 { stroke: #ea580c; stroke-width: 8; fill: none; }
      .gnd { stroke: #111827; stroke-width: 8; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="60" y="60" class="title">Week 2 接線關係圖</text>
  <text x="60" y="98" class="small">先拔除 USB 再接線；有同學時一起檢查，獨自操作時正向、反向各檢查一次。</text>

  <rect x="70" y="150" width="350" height="440" rx="24" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
  <text x="245" y="200" text-anchor="middle" class="subtitle">ESP32-S3</text>
  <text x="245" y="235" text-anchor="middle" class="small">DevKitC-1 N16R8</text>

  <rect x="285" y="275" width="195" height="54" rx="10" fill="#2563eb"/>
  <text x="382" y="309" text-anchor="middle" class="pin">PIN_BUTTON</text>
  <rect x="270" y="433" width="225" height="54" rx="10" fill="#ea580c"/>
  <text x="382" y="467" text-anchor="middle" class="pin">PIN_TEST_OUTPUT</text>
  <rect x="325" y="515" width="115" height="54" rx="10" fill="#111827"/>
  <text x="382" y="549" text-anchor="middle" class="pin">GND</text>

  <rect x="530" y="150" width="600" height="440" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="4"/>
  <text x="830" y="200" text-anchor="middle" class="subtitle">麵包板上的三個區域</text>

  <path d="M440 302 H590" class="wire4"/>
  <circle cx="610" cy="302" r="18" fill="white" stroke="#2563eb" stroke-width="6"/>
  <circle cx="790" cy="302" r="18" fill="white" stroke="#111827" stroke-width="6"/>
  <rect x="655" y="258" width="90" height="88" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="4"/>
  <text x="700" y="294" text-anchor="middle" class="label">四腳</text>
  <text x="700" y="323" text-anchor="middle" class="label">按鈕</text>
  <path d="M628 302 H655 M745 302 H772" class="wire4"/>
  <path d="M808 302 H1040 V542 H440" class="gnd"/>
  <text x="780" y="365" text-anchor="middle" class="small">未按下：PIN_BUTTON = HIGH</text>
  <text x="780" y="398" text-anchor="middle" class="small">按下：PIN_BUTTON 經按鈕接 GND = LOW</text>

  <path d="M440 460 H820" class="wire5"/>
  <circle cx="850" cy="460" r="30" fill="#fff7ed" stroke="#ea580c" stroke-width="7"/>
  <text x="850" y="467" text-anchor="middle" class="label">TPO</text>
  <text x="850" y="507" text-anchor="middle" class="small">紅表筆測試點</text>

  <path d="M440 542 H820" class="gnd"/>
  <circle cx="850" cy="542" r="30" fill="#f1f5f9" stroke="#111827" stroke-width="7"/>
  <text x="850" y="549" text-anchor="middle" class="label">TPG</text>
  <text x="850" y="590" text-anchor="middle" class="small">黑表筆／GND</text>

  <rect x="70" y="625" width="1060" height="50" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="600" y="658" text-anchor="middle" class="label" fill="#991b1b">本週沒有任何一條線接 5V、3V3、LED、蜂鳴器或馬達</text>
</svg>
