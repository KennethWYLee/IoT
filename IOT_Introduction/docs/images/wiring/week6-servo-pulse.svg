<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img"><title>把電壓高低畫在時間軸上</title><desc>示例20 ms／1.5 ms，非所有SG90的核准參數；水平比例僅為教學示意。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="610" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">把電壓高低畫在時間軸上</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">示例20 ms／1.5 ms，非所有SG90的核准參數；水平比例僅為教學示意。</text><text x="35" y="203" font-size="25" fill="#1765ad" text-anchor="start">HIGH</text><text x="35" y="326" font-size="25" fill="#183047" text-anchor="start">LOW</text><line x1="150" y1="320" x2="190" y2="320" stroke="#1765ad" stroke-width="3"/><line x1="190" y1="320" x2="190" y2="200" stroke="#1765ad" stroke-width="3"/><line x1="190" y1="200" x2="270" y2="200" stroke="#1765ad" stroke-width="3"/><line x1="270" y1="200" x2="270" y2="320" stroke="#1765ad" stroke-width="3"/><line x1="270" y1="320" x2="1020" y2="320" stroke="#1765ad" stroke-width="3"/><line x1="1020" y1="320" x2="1020" y2="200" stroke="#1765ad" stroke-width="3"/><line x1="1020" y1="200" x2="1100" y2="200" stroke="#1765ad" stroke-width="3"/><line x1="190" y1="165" x2="270" y2="165" stroke="#087768" stroke-width="3"/><text x="230" y="145" font-size="24" fill="#087768" text-anchor="middle">高1.5 ms</text><line x1="190" y1="390" x2="1020" y2="390" stroke="#52657a" stroke-width="3"/><text x="600" y="435" font-size="27" fill="#183047" text-anchor="middle">週期20 ms = 0.02 s → 每秒50次 = 50 Hz</text><text x="35" y="503" font-size="25" fill="#183047" text-anchor="start">1.5 ms = 1500 µs；高脈寬不是整個週期。圖為時間關係示意。</text><text x="35" y="562" font-size="25" fill="#ae2842" text-anchor="start">電表直流檔的平均讀值不是脈寬、角度，也不是波形驗證。</text></svg>
