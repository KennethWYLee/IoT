<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img"><title>取樣是一串有時間與條件的觀察</title><desc>教學時間示例，不是實體ESP32精確排程量測。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="715" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">取樣是一串有時間與條件的觀察</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">教學時間示例，不是實體ESP32精確排程量測。</text><text x="30" y="146" font-size="27" fill="#1765ad" text-anchor="start">一輪開始 → 等500 ms → 第1筆 → …… → 第10筆 → 停止</text><line x1="95" y1="245" x2="1100" y2="245" stroke="#52657a" stroke-width="3"/><circle cx="105" cy="245" r="6" fill="#1765ad"/><text x="105" y="206" font-size="25" fill="#183047" text-anchor="middle">1</text><text x="105" y="291" font-size="21" fill="#52657a" text-anchor="middle">500</text><circle cx="213" cy="245" r="6" fill="#1765ad"/><text x="213" y="206" font-size="25" fill="#183047" text-anchor="middle">2</text><text x="213" y="291" font-size="21" fill="#52657a" text-anchor="middle">1000</text><circle cx="321" cy="245" r="6" fill="#1765ad"/><text x="321" y="206" font-size="25" fill="#183047" text-anchor="middle">3</text><text x="321" y="291" font-size="21" fill="#52657a" text-anchor="middle">1500</text><circle cx="429" cy="245" r="6" fill="#1765ad"/><text x="429" y="206" font-size="25" fill="#183047" text-anchor="middle">4</text><text x="429" y="291" font-size="21" fill="#52657a" text-anchor="middle">2000</text><circle cx="537" cy="245" r="6" fill="#1765ad"/><text x="537" y="206" font-size="25" fill="#183047" text-anchor="middle">5</text><text x="537" y="291" font-size="21" fill="#52657a" text-anchor="middle">2500</text><circle cx="645" cy="245" r="6" fill="#1765ad"/><text x="645" y="206" font-size="25" fill="#183047" text-anchor="middle">6</text><text x="645" y="291" font-size="21" fill="#52657a" text-anchor="middle">3000</text><circle cx="753" cy="245" r="6" fill="#1765ad"/><text x="753" y="206" font-size="25" fill="#183047" text-anchor="middle">7</text><text x="753" y="291" font-size="21" fill="#52657a" text-anchor="middle">3500</text><circle cx="861" cy="245" r="6" fill="#1765ad"/><text x="861" y="206" font-size="25" fill="#183047" text-anchor="middle">8</text><text x="861" y="291" font-size="21" fill="#52657a" text-anchor="middle">4000</text><circle cx="969" cy="245" r="6" fill="#1765ad"/><text x="969" y="206" font-size="25" fill="#183047" text-anchor="middle">9</text><text x="969" y="291" font-size="21" fill="#52657a" text-anchor="middle">4500</text><circle cx="1077" cy="245" r="6" fill="#1765ad"/><text x="1077" y="206" font-size="25" fill="#183047" text-anchor="middle">10</text><text x="1077" y="291" font-size="21" fill="#52657a" text-anchor="middle">5000</text><text x="30" y="340" font-size="24" fill="#183047" text-anchor="start">上排：筆序；下排：相對輪次開始的理想毫秒。實際以log為準。</text><rect x="35" y="385" width="1130" height="139" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="60" y="432" font-size="29" fill="#1765ad" text-anchor="start">第1筆到第10筆：10 − 1 = 9個間隔</text><text x="60" y="480" font-size="27" fill="#183047" text-anchor="start">9 × 500 ms = 4500 ms = 4.5秒；不是10個間隔。</text><text x="30" y="577" font-size="26" fill="#183047" text-anchor="start">室內光：固定模組、方向、供電、間隔 → 記10筆。</text><text x="30" y="625" font-size="26" fill="#183047" text-anchor="start">遮光：只增加固定遮光物，其餘相同 → 另記10筆。</text><text x="30" y="677" font-size="25" fill="#ae2842" text-anchor="start">有波動不立即判壞；缺筆不補造。10筆平均不能代替原始log。</text></svg>
