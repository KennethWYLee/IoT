<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="810" viewBox="0 0 1230 810" role="img" aria-labelledby="title desc">
<title id="title">封閉迴路不是「再把3V3直接接回GND」</title><desc id="desc">三個概念電路分別為正常串聯、中斷及禁止短接。不是板內接線圖。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style>
<rect width="1230" height="810" fill="white"/><text x="32" y="48" font-size="32" fill="#183047" text-anchor="start" font-weight="700">封閉迴路不是「再把3V3直接接回GND」</text><text x="32" y="90" font-size="23" fill="#183047" text-anchor="start" font-weight="400">圖只比較外部電阻負載。箭頭為傳統電流方向；不是要求實際斷線或短接。</text><rect x="28" y="125" width="378" height="600" rx="12" fill="#f5f9fc" stroke="#ccd7e1" stroke-width="2"/><text x="46" y="166" font-size="25" fill="#183047" text-anchor="start" font-weight="700">完整負載路徑</text><rect x="51" y="285" width="118" height="160" rx="12" fill="#e9f2f7" stroke="#ccd7e1" stroke-width="2"/><text x="110" y="334" font-size="22" fill="#183047" text-anchor="middle" font-weight="400">供電電路</text><text x="110" y="374" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">維持兩端</text><text x="110" y="409" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">電位差</text><path d="M110 285V222H263V267" fill="none" stroke="#087768" stroke-width="4" stroke-linejoin="round"/><circle cx="263" cy="222" r="6" fill="#087768"/><text x="277" y="229" font-size="22" fill="#087768" text-anchor="start" font-weight="400">3V3</text><rect x="239" y="267" width="48" height="74" rx="3" fill="#fff5d9" stroke="#ad914f" stroke-width="2"/><text x="297" y="310" font-size="21" fill="#183047" text-anchor="start" font-weight="400">10 kΩ</text><line x1="263" y1="341" x2="263" y2="366" stroke="#087768" stroke-width="4"/><line x1="263" y1="366" x2="263" y2="415" stroke="#087768" stroke-width="4"/><rect x="239" y="415" width="48" height="74" rx="3" fill="#fff5d9" stroke="#ad914f" stroke-width="2"/><text x="297" y="460" font-size="21" fill="#183047" text-anchor="start" font-weight="400">1 kΩ</text><line x1="263" y1="489" x2="263" y2="530" stroke="#087768" stroke-width="4"/><path d="M263 530H110V445" fill="none" stroke="#087768" stroke-width="4" stroke-linejoin="round"/><circle cx="263" cy="530" r="6" fill="#087768"/><text x="275" y="538" font-size="21" fill="#087768" text-anchor="start" font-weight="400">GND</text><text x="216" y="252" font-size="29" fill="#087768" text-anchor="start" font-weight="400">→</text><text x="198" y="525" font-size="29" fill="#087768" text-anchor="start" font-weight="400">←</text><text x="46" y="603" font-size="21" fill="#183047" text-anchor="start" font-weight="400">電流經兩顆電阻再回電源。</text><text x="46" y="640" font-size="21" fill="#183047" text-anchor="start" font-weight="400">3.3 V ÷ 11 kΩ = 0.30 mA</text><text x="46" y="677" font-size="21" fill="#183047" text-anchor="start" font-weight="400">這是計算，不用電流檔量。</text><rect x="425" y="125" width="378" height="600" rx="12" fill="#f5f9fc" stroke="#ccd7e1" stroke-width="2"/><text x="443" y="166" font-size="25" fill="#183047" text-anchor="start" font-weight="700">負載路徑中斷</text><rect x="448" y="285" width="118" height="160" rx="12" fill="#e9f2f7" stroke="#ccd7e1" stroke-width="2"/><text x="507" y="334" font-size="22" fill="#183047" text-anchor="middle" font-weight="400">供電電路</text><text x="507" y="374" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">維持兩端</text><text x="507" y="409" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">電位差</text><path d="M507 285V222H660V267" fill="none" stroke="#087768" stroke-width="4" stroke-linejoin="round"/><circle cx="660" cy="222" r="6" fill="#087768"/><text x="674" y="229" font-size="22" fill="#087768" text-anchor="start" font-weight="400">3V3</text><rect x="636" y="267" width="48" height="74" rx="3" fill="#fff5d9" stroke="#ad914f" stroke-width="2"/><text x="694" y="310" font-size="21" fill="#183047" text-anchor="start" font-weight="400">10 kΩ</text><line x1="660" y1="341" x2="660" y2="366" stroke="#087768" stroke-width="4"/><line x1="660" y1="395" x2="660" y2="415" stroke="#087768" stroke-width="4"/><text x="674" y="387" font-size="21" fill="#ae2842" text-anchor="start" font-weight="400">斷開</text><rect x="636" y="415" width="48" height="74" rx="3" fill="#fff5d9" stroke="#ad914f" stroke-width="2"/><text x="694" y="460" font-size="21" fill="#183047" text-anchor="start" font-weight="400">1 kΩ</text><line x1="660" y1="489" x2="660" y2="530" stroke="#087768" stroke-width="4"/><path d="M660 530H507V445" fill="none" stroke="#087768" stroke-width="4" stroke-linejoin="round"/><circle cx="660" cy="530" r="6" fill="#087768"/><text x="672" y="538" font-size="21" fill="#087768" text-anchor="start" font-weight="400">GND</text><text x="443" y="603" font-size="21" fill="#183047" text-anchor="start" font-weight="400">原來的負載支路不能持續通流。</text><text x="443" y="640" font-size="21" fill="#183047" text-anchor="start" font-weight="400">不代表整片ESP32都沒電。</text><text x="443" y="677" font-size="21" fill="#183047" text-anchor="start" font-weight="400">USB仍可能供應板上其他電路。</text><rect x="822" y="125" width="378" height="600" rx="12" fill="#fff4f4" stroke="#ccd7e1" stroke-width="2"/><text x="840" y="166" font-size="25" fill="#ae2842" text-anchor="start" font-weight="700">禁止實作：電源短接</text><rect x="845" y="285" width="118" height="160" rx="12" fill="#e9f2f7" stroke="#ccd7e1" stroke-width="2"/><text x="904" y="334" font-size="22" fill="#183047" text-anchor="middle" font-weight="400">供電電路</text><text x="904" y="374" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">維持兩端</text><text x="904" y="409" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">電位差</text><path d="M904 285V222H1057V267" fill="none" stroke="#ae2842" stroke-width="4" stroke-linejoin="round"/><circle cx="1057" cy="222" r="6" fill="#ae2842"/><text x="1071" y="229" font-size="22" fill="#ae2842" text-anchor="start" font-weight="400">3V3</text><line x1="1057" y1="267" x2="1057" y2="530" stroke="#ae2842" stroke-width="6"/><text x="1074" y="360" font-size="21" fill="#ae2842" text-anchor="start" font-weight="400">只剩</text><text x="1074" y="393" font-size="21" fill="#ae2842" text-anchor="start" font-weight="400">導線</text><path d="M1057 530H904V445" fill="none" stroke="#ae2842" stroke-width="4" stroke-linejoin="round"/><circle cx="1057" cy="530" r="6" fill="#ae2842"/><text x="1069" y="538" font-size="21" fill="#ae2842" text-anchor="start" font-weight="400">GND</text><text x="1010" y="252" font-size="29" fill="#ae2842" text-anchor="start" font-weight="400">→</text><text x="992" y="525" font-size="29" fill="#ae2842" text-anchor="start" font-weight="400">←</text><text x="840" y="603" font-size="21" fill="#ae2842" text-anchor="start" font-weight="400">繞過電阻，電流可能過大。</text><text x="840" y="640" font-size="21" fill="#ae2842" text-anchor="start" font-weight="400">實際電流受電源與線路限制。</text><text x="840" y="677" font-size="21" fill="#ae2842" text-anchor="start" font-weight="400">不要為了觀察而搭這種接法。</text><text x="32" y="775" font-size="24" fill="#183047" text-anchor="start" font-weight="400">串聯電阻消耗的是電能，不是把電流分成兩半；電源讓迴路能持續運作。</text>
</svg>
