<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="915" viewBox="0 0 1310 915" role="img" aria-labelledby="title desc">
<title id="title">把分壓真正搭出來：三個節點、兩顆電阻</title><desc id="desc">接法A上電阻b20-b25下電阻d25-d30，電表紅e25黑e3；接法B只交換阻值。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style>
<rect width="1310" height="915" fill="white"/><text x="32" y="48" font-size="32" fill="#183047" text-anchor="start" font-weight="700">把分壓真正搭出來：三個節點、兩顆電阻</text><text x="32" y="92" font-size="24" fill="#183047" text-anchor="start" font-weight="400">只使用1 kΩ與10 kΩ各一顆。先預測；不接GPIO、KY-018、5Vin或電流檔。</text><rect x="26" y="125" width="741" height="662" rx="12" fill="#f3f7fb" stroke="#ccd7e1" stroke-width="2"/><text x="53" y="170" font-size="27" fill="#183047" text-anchor="start" font-weight="700">接法A：上10 kΩ，下1 kΩ</text><text x="150" y="211" font-size="25" fill="#183047" text-anchor="middle" font-weight="700">a</text><text x="260" y="211" font-size="25" fill="#183047" text-anchor="middle" font-weight="700">b</text><text x="370" y="211" font-size="25" fill="#183047" text-anchor="middle" font-weight="700">c</text><text x="480" y="211" font-size="25" fill="#183047" text-anchor="middle" font-weight="700">d</text><text x="590" y="211" font-size="25" fill="#183047" text-anchor="middle" font-weight="700">e</text><line x1="150" y1="250" x2="590" y2="250" stroke="#97a9b9" stroke-width="15"/><text x="76" y="258" font-size="25" fill="#183047" text-anchor="start" font-weight="400">20</text><circle cx="150" cy="250" r="13" fill="white"/><circle cx="150" cy="250" r="5" fill="#183047"/><text x="150" y="294" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">a20</text><circle cx="260" cy="250" r="13" fill="white"/><circle cx="260" cy="250" r="5" fill="#183047"/><text x="283" y="294" font-size="19" fill="#183047" text-anchor="start" font-weight="400">b20</text><circle cx="370" cy="250" r="13" fill="white"/><circle cx="370" cy="250" r="5" fill="#183047"/><text x="370" y="294" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">c20</text><circle cx="480" cy="250" r="13" fill="white"/><circle cx="480" cy="250" r="5" fill="#183047"/><text x="480" y="294" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">d20</text><circle cx="590" cy="250" r="13" fill="white"/><circle cx="590" cy="250" r="5" fill="#183047"/><text x="590" y="294" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">e20</text><line x1="150" y1="450" x2="590" y2="450" stroke="#97a9b9" stroke-width="15"/><text x="76" y="458" font-size="25" fill="#183047" text-anchor="start" font-weight="400">25</text><circle cx="150" cy="450" r="13" fill="white"/><circle cx="150" cy="450" r="5" fill="#183047"/><text x="150" y="494" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">a25</text><circle cx="260" cy="450" r="13" fill="white"/><circle cx="260" cy="450" r="5" fill="#183047"/><text x="260" y="494" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">b25</text><circle cx="370" cy="450" r="13" fill="white"/><circle cx="370" cy="450" r="5" fill="#183047"/><text x="370" y="494" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">c25</text><circle cx="480" cy="450" r="13" fill="white"/><circle cx="480" cy="450" r="5" fill="#183047"/><text x="503" y="494" font-size="19" fill="#183047" text-anchor="start" font-weight="400">d25</text><circle cx="590" cy="450" r="13" fill="white"/><circle cx="590" cy="450" r="5" fill="#183047"/><text x="590" y="494" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">e25</text><line x1="150" y1="650" x2="590" y2="650" stroke="#97a9b9" stroke-width="15"/><text x="76" y="658" font-size="25" fill="#183047" text-anchor="start" font-weight="400">30</text><circle cx="150" cy="650" r="13" fill="white"/><circle cx="150" cy="650" r="5" fill="#183047"/><text x="150" y="694" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">a30</text><circle cx="260" cy="650" r="13" fill="white"/><circle cx="260" cy="650" r="5" fill="#183047"/><text x="260" y="694" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">b30</text><circle cx="370" cy="650" r="13" fill="white"/><circle cx="370" cy="650" r="5" fill="#183047"/><text x="370" y="694" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">c30</text><circle cx="480" cy="650" r="13" fill="white"/><circle cx="480" cy="650" r="5" fill="#183047"/><text x="480" y="694" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">d30</text><circle cx="590" cy="650" r="13" fill="white"/><circle cx="590" cy="650" r="5" fill="#183047"/><text x="590" y="694" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">e30</text><line x1="260" y1="250" x2="260" y2="310" stroke="#ae2842" stroke-width="4"/><rect x="236" y="310" width="48" height="80" rx="3" fill="#fff5d9" stroke="#ad914f" stroke-width="2"/><line x1="260" y1="390" x2="260" y2="450" stroke="#1765ad" stroke-width="4"/><text x="305" y="342" font-size="25" fill="#183047" text-anchor="start" font-weight="400">10 kΩ</text><text x="305" y="376" font-size="23" fill="#183047" text-anchor="start" font-weight="400">b20 ↔ b25</text><line x1="480" y1="450" x2="480" y2="510" stroke="#1765ad" stroke-width="4"/><rect x="456" y="510" width="48" height="80" rx="3" fill="#fff5d9" stroke="#ad914f" stroke-width="2"/><line x1="480" y1="590" x2="480" y2="650" stroke="#087768" stroke-width="4"/><text x="296" y="543" font-size="25" fill="#183047" text-anchor="start" font-weight="400">1 kΩ</text><text x="296" y="580" font-size="23" fill="#183047" text-anchor="start" font-weight="400">d25 ↔ d30</text><path d="M150 250H111V225" fill="none" stroke="#ae2842" stroke-width="4" stroke-linejoin="round"/><path d="M150 650H111V678" fill="none" stroke="#087768" stroke-width="4" stroke-linejoin="round"/><text x="620" y="256" font-size="22" fill="#ae2842" text-anchor="start" font-weight="400">供電節點</text><text x="54" y="724" font-size="24" fill="#ae2842" text-anchor="start" font-weight="400">b6 → a20：已核對的3V3</text><text x="54" y="764" font-size="24" fill="#087768" text-anchor="start" font-weight="400">b3 → a30：共同GND</text><path d="M590 450H716V425" fill="none" stroke="#ae2842" stroke-width="4" stroke-linejoin="round"/><text x="603" y="388" font-size="21" fill="#ae2842" text-anchor="start" font-weight="400">e25延長端</text><text x="603" y="418" font-size="23" fill="#ae2842" text-anchor="start" font-weight="400">紅表筆</text><text x="620" y="657" font-size="22" fill="#087768" text-anchor="start" font-weight="400">GND節點</text><rect x="795" y="125" width="485" height="300" rx="12" fill="#edf5ff" stroke="#a7c5e2" stroke-width="2"/><text x="817" y="169" font-size="27" fill="#1765ad" text-anchor="start" font-weight="700">接法B：斷電後才交換</text><text x="817" y="226" font-size="25" fill="#183047" text-anchor="start" font-weight="400">b20 ↔ b25 改放1 kΩ</text><text x="817" y="275" font-size="25" fill="#183047" text-anchor="start" font-weight="400">d25 ↔ d30 改放10 kΩ</text><text x="817" y="324" font-size="23" fill="#183047" text-anchor="start" font-weight="400">其餘線與測點全部保持不變。</text><text x="817" y="373" font-size="23" fill="#183047" text-anchor="start" font-weight="400">不是調換表筆，也不是電源反接。</text><rect x="795" y="453" width="485" height="334" rx="12" fill="#f3f7fb" stroke="#ccd7e1" stroke-width="2"/><text x="817" y="500" font-size="27" fill="#183047" text-anchor="start" font-weight="700">電表：直流V⎓ 20</text><text x="817" y="551" font-size="24" fill="#ae2842" text-anchor="start" font-weight="400">紅表筆 → e25的S_R延長端</text><text x="817" y="599" font-size="24" fill="#183047" text-anchor="start" font-weight="400">黑表筆 → e3的PGND延長端</text><text x="817" y="654" font-size="23" fill="#183047" text-anchor="start" font-weight="400">第25列：b25、d25、e25相通。</text><text x="817" y="699" font-size="23" fill="#183047" text-anchor="start" font-weight="400">兩顆電阻在此相接，沒有被繞過。</text><text x="817" y="752" font-size="23" fill="#ae2842" text-anchor="start" font-weight="400">USB供電前，核對每一端座標。</text><text x="32" y="838" font-size="23" fill="#183047" text-anchor="start" font-weight="400">孔位示意，列距非實物比例。第20、25、30列彼此分開；電阻兩腳不能插同一五孔組。</text><text x="32" y="881" font-size="23" fill="#52657a" text-anchor="start" font-weight="400">藍圖只表示設計接法，不是已完成實機驗證；預期值與解釋見第13.8節。</text>
</svg>
