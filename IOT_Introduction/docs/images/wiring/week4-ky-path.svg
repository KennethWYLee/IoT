<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="735" viewBox="0 0 1200 735" role="img"><title>承接Week 3：保留功能與節點，這次研究資料品質</title><desc>功能連線示意；不是實物左右腳序，也不是公開GPIO編號。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="735" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">承接Week 3：保留功能與節點，這次研究資料品質</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">功能連線示意；不是實物左右腳序，也不是公開GPIO編號。</text><rect x="30" y="140" width="300" height="390" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><rect x="850" y="140" width="320" height="390" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="65" y="185" font-size="28" fill="#1765ad" text-anchor="start">ESP32（已核准）</text><text x="885" y="185" font-size="27" fill="#087768" text-anchor="start">KY-018（已核對）</text><text x="55" y="235" font-size="25" fill="#ae2842" text-anchor="start">3V3</text><text x="880" y="235" font-size="25" fill="#ae2842" text-anchor="start">M：供電</text><line x1="330" y1="227" x2="850" y2="227" stroke="#ae2842" stroke-width="4"/><text x="590" y="209" font-size="25" fill="#ae2842" text-anchor="middle">a6 ↔ c6</text><text x="55" y="350" font-size="25" fill="#183047" text-anchor="start">GND</text><text x="880" y="350" font-size="25" fill="#183047" text-anchor="start">−：GND</text><line x1="330" y1="342" x2="850" y2="342" stroke="#183047" stroke-width="4"/><text x="590" y="324" font-size="25" fill="#183047" text-anchor="middle">a3 ↔ c3</text><text x="55" y="465" font-size="25" fill="#1765ad" text-anchor="start">ADC GPIO</text><text x="880" y="465" font-size="25" fill="#1765ad" text-anchor="start">S：類比訊號</text><line x1="330" y1="457" x2="850" y2="457" stroke="#1765ad" stroke-width="4"/><text x="590" y="439" font-size="25" fill="#1765ad" text-anchor="middle">c15 ↔ a15</text><text x="30" y="593" font-size="26" fill="#183047" text-anchor="start">M是本課對中間腳的代稱；電路分壓取樣點是S，不是M。</text><text x="30" y="644" font-size="25" fill="#183047" text-anchor="start">ADC比較S對共同GND；本圖省略模組內電阻，只追三條外部路徑。</text><text x="30" y="695" font-size="24" fill="#ae2842" text-anchor="start">實物腳位依核准照片，不依圖的上下位置。上電前先Upload輸入程式。</text></svg>
