<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="835" viewBox="0 0 1200 835" role="img"><title>穩定狀態 ≠ 每一筆採樣 ≠ 一次新事件</title><desc>理想時間示例，非實測波形；實際接受時間受採樣與loop延遲影響。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="835" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">穩定狀態 ≠ 每一筆採樣 ≠ 一次新事件</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">理想時間示例，非實測波形；實際接受時間受採樣與loop延遲影響。</text><rect x="30" y="135" width="1140" height="115" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="50" y="178" font-size="28" fill="#1765ad" text-anchor="start">0～150 ms</text><text x="335" y="178" font-size="27" fill="#183047" text-anchor="start">室內候選持續</text><text x="50" y="224" font-size="25" fill="#183047" text-anchor="start">接受INDOOR</text><text x="550" y="224" font-size="26" fill="#087768" text-anchor="start">armed=true</text><rect x="30" y="272" width="1140" height="115" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="50" y="315" font-size="28" fill="#1765ad" text-anchor="start">200～350 ms</text><text x="335" y="315" font-size="27" fill="#183047" text-anchor="start">遮光候選持續</text><text x="50" y="361" font-size="25" fill="#183047" text-anchor="start">接受SHADE</text><text x="550" y="361" font-size="26" fill="#ae2842" text-anchor="start">事件+1；armed=false</text><rect x="30" y="409" width="1140" height="115" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="50" y="452" font-size="28" fill="#1765ad" text-anchor="start">350～600 ms</text><text x="335" y="452" font-size="27" fill="#183047" text-anchor="start">保持遮光</text><text x="50" y="498" font-size="25" fill="#183047" text-anchor="start">仍是SHADE</text><text x="550" y="498" font-size="26" fill="#087768" text-anchor="start">沒有新事件</text><rect x="30" y="546" width="1140" height="115" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="50" y="589" font-size="28" fill="#1765ad" text-anchor="start">600～750 ms</text><text x="335" y="589" font-size="27" fill="#183047" text-anchor="start">解除候選持續</text><text x="50" y="635" font-size="25" fill="#183047" text-anchor="start">接受INDOOR</text><text x="550" y="635" font-size="26" fill="#087768" text-anchor="start">下一次才可再觸發</text><text x="30" y="742" font-size="26" fill="#183047" text-anchor="start">150 ms是候選分類持續時間，不要求每一筆raw完全相等。</text><text x="30" y="792" font-size="25" fill="#ae2842" text-anchor="start">開機已遮住、資料無效後仍遮住：先等穩定解除，不憑空新增事件。</text></svg>
