<svg xmlns="http://www.w3.org/2000/svg" width="1005" height="1126" viewBox="0 0 1005 1126" role="img" aria-labelledby="title desc">
<title id="title">相似的數字，可能是完全不同的量</title><desc id="desc">模擬LCD對照200歐姆、200k歐姆、20伏特及左側單獨1與有效1.00。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style>
<rect width="1005" height="1126" fill="white"/><text x="32" y="48" font-size="32" fill="#183047" text-anchor="start" font-weight="700">相似的數字，可能是完全不同的量</text><text x="32" y="92" font-size="22" fill="#183047" text-anchor="start" font-weight="400">下方是模擬LCD，不是實拍或新實測。檔位標在螢幕外；先看功能，再讀小數點。</text><rect x="28" y="127" width="945" height="167" rx="12" fill="#f3f7fb" stroke="#ccd7e1" stroke-width="2"/><text x="50" y="166" font-size="24" fill="#1765ad" text-anchor="start" font-weight="700">Ω 200；外部斷電</text><rect x="49" y="188" width="257" height="81" rx="4" fill="#e5ecd8" stroke="#849271" stroke-width="2"/><text x="287" y="244" font-size="40" fill="#183047" text-anchor="end" font-weight="700">0.6</text><text x="339" y="218" font-size="28" fill="#183047" text-anchor="start" font-weight="700">0.6 Ω</text><text x="339" y="261" font-size="23" fill="#183047" text-anchor="start" font-weight="400">短接表筆：低電阻通路。</text><rect x="28" y="311" width="945" height="167" rx="12" fill="#f3f7fb" stroke="#ccd7e1" stroke-width="2"/><text x="50" y="350" font-size="24" fill="#1765ad" text-anchor="start" font-weight="700">Ω 200k；模組斷電</text><rect x="49" y="372" width="257" height="81" rx="4" fill="#e5ecd8" stroke="#849271" stroke-width="2"/><text x="287" y="428" font-size="40" fill="#183047" text-anchor="end" font-weight="700">0.6</text><text x="339" y="402" font-size="28" fill="#183047" text-anchor="start" font-weight="700">0.6 kΩ＝600 Ω</text><text x="339" y="445" font-size="23" fill="#183047" text-anchor="start" font-weight="400">不能與上一列當成相同阻值。</text><rect x="28" y="495" width="945" height="167" rx="12" fill="#f3f7fb" stroke="#ccd7e1" stroke-width="2"/><text x="50" y="534" font-size="24" fill="#1765ad" text-anchor="start" font-weight="700">V⎓ 20；模組供電</text><rect x="49" y="556" width="257" height="81" rx="4" fill="#e5ecd8" stroke="#849271" stroke-width="2"/><text x="287" y="612" font-size="40" fill="#183047" text-anchor="end" font-weight="700">0.60</text><text x="339" y="586" font-size="28" fill="#183047" text-anchor="start" font-weight="700">+0.60 V</text><text x="339" y="629" font-size="23" fill="#183047" text-anchor="start" font-weight="400">紅S、黑GND：兩點電位差。</text><rect x="28" y="679" width="945" height="167" rx="12" fill="#f3f7fb" stroke="#ccd7e1" stroke-width="2"/><text x="50" y="718" font-size="24" fill="#1765ad" text-anchor="start" font-weight="700">Ω 20k；模組斷電</text><rect x="49" y="740" width="257" height="81" rx="4" fill="#e5ecd8" stroke="#849271" stroke-width="2"/><text x="68" y="796" font-size="40" fill="#183047" text-anchor="start" font-weight="700">1</text><text x="339" y="770" font-size="28" fill="#183047" text-anchor="start" font-weight="700">不填數值與Ω</text><text x="339" y="813" font-size="23" fill="#183047" text-anchor="start" font-weight="400">左側單獨1：超量程或開路提示。</text><rect x="28" y="863" width="945" height="167" rx="12" fill="#f3f7fb" stroke="#ccd7e1" stroke-width="2"/><text x="50" y="902" font-size="24" fill="#1765ad" text-anchor="start" font-weight="700">Ω 20k；模組斷電</text><rect x="49" y="924" width="257" height="81" rx="4" fill="#e5ecd8" stroke="#849271" stroke-width="2"/><text x="287" y="980" font-size="40" fill="#183047" text-anchor="end" font-weight="700">1.00</text><text x="339" y="954" font-size="28" fill="#183047" text-anchor="start" font-weight="700">1.00 kΩ＝1000 Ω</text><text x="339" y="997" font-size="23" fill="#183047" text-anchor="start" font-weight="400">正常有效數字，不是上一列的提示。</text><text x="32" y="1090" font-size="24" fill="#ae2842" text-anchor="start" font-weight="400">蜂鳴檔有聲音≠0 Ω；未核對檔位的「61」不能補上Ω。</text>
</svg>
