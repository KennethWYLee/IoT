<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>螢幕在說什麼？先逐行讀</title><desc>英文是實際範例字串；中文對照供閱讀，不假設螢幕已載入中文字型。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="700" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">螢幕在說什麼？先逐行讀</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">英文是實際範例字串；中文對照供閱讀，不假設螢幕已載入中文字型。</text><rect x="35" y="145" width="535" height="405" rx="12" fill="#101f2c" stroke="#bacbd7" stroke-width="2"/><text x="65" y="206" font-size="36" fill="#fff" text-anchor="start">RUNNING</text><text x="65" y="293" font-size="44" fill="#fff" text-anchor="start">TIME 29 s</text><text x="65" y="388" font-size="32" fill="#fff" text-anchor="start">GREEN / COVER</text><text x="65" y="480" font-size="28" fill="#fff" text-anchor="start">DEMO 3/6 NOT SCORE</text><line x1="575" y1="196" x2="625" y2="196" stroke="#1765ad" stroke-width="3"/><path d="M613.5914266954252,189.76746799814535 L625,196 L613.5914266954252,202.23253200185465" fill="none" stroke="#1765ad" stroke-width="3"/><text x="645" y="206" font-size="25" fill="#183047" text-anchor="start">目前狀態：進行中</text><line x1="575" y1="283" x2="625" y2="283" stroke="#1765ad" stroke-width="3"/><path d="M613.5914266954252,276.7674679981454 L625,283 L613.5914266954252,289.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><text x="645" y="293" font-size="25" fill="#183047" text-anchor="start">剩餘28.5秒，向上取整29</text><line x1="575" y1="378" x2="625" y2="378" stroke="#1765ad" stroke-width="3"/><path d="M613.5914266954252,371.7674679981454 L625,378 L613.5914266954252,384.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><text x="645" y="388" font-size="25" fill="#183047" text-anchor="start">規則：綠燈允許遮光</text><line x1="575" y1="470" x2="625" y2="470" stroke="#1765ad" stroke-width="3"/><path d="M613.5914266954252,463.7674679981454 L625,470 L613.5914266954252,476.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><text x="645" y="480" font-size="25" fill="#183047" text-anchor="start">人工示例次數，不是遊戲得分</text><text x="30" y="607" font-size="24" fill="#ae2842" text-anchor="start">示意資料，非實機截圖。字串、字型、像素與實際可讀性均須上機確認。</text><text x="30" y="656" font-size="24" fill="#183047" text-anchor="start">先固定畫面，再倒數；圖中三者不能替代：內部資料、傳送命令、實物顯示。</text></svg>
