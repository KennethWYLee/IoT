<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>控制訊號、工作電力、共同參考：分三條路看</title><desc>功能示意。供電種類、端子、電流能力、腳位與邏輯相容性皆須核准。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="820" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">控制訊號、工作電力、共同參考：分三條路看</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">功能示意。供電種類、端子、電流能力、腳位與邏輯相容性皆須核准。</text><rect x="30" y="150" width="295" height="350" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="65" y="205" font-size="25" fill="#1765ad" text-anchor="start">電腦USB → ESP32</text><text x="65" y="290" font-size="27" fill="#1765ad" text-anchor="start">訊號GPIO</text><text x="65" y="452" font-size="28" fill="#183047" text-anchor="start">GND</text><rect x="850" y="150" width="320" height="350" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="910" y="205" font-size="29" fill="#087768" text-anchor="start">SG90內部</text><text x="885" y="290" font-size="27" fill="#1765ad" text-anchor="start">signal</text><text x="885" y="365" font-size="24" fill="#ae2842" text-anchor="start">V+ → 馬達／控制</text><text x="885" y="452" font-size="28" fill="#183047" text-anchor="start">GND</text><line x1="325" y1="280" x2="850" y2="280" stroke="#1765ad" stroke-width="3"/><path d="M838.5914266954252,273.7674679981454 L850,280 L838.5914266954252,286.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><text x="560" y="258" font-size="25" fill="#1765ad" text-anchor="middle">位置指令脈波</text><line x1="325" y1="445" x2="850" y2="445" stroke="#52657a" stroke-width="3"/><text x="565" y="422" font-size="25" fill="#183047" text-anchor="middle">共同參考地</text><rect x="365" y="545" width="490" height="125" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="610" y="588" font-size="27" fill="#183047" text-anchor="middle">核准外部電源與安全端子</text><text x="420" y="640" font-size="26" fill="#183047" text-anchor="start">負極 −</text><text x="710" y="640" font-size="26" fill="#ae2842" text-anchor="start">正極 +</text><line x1="395" y1="620" x2="345" y2="620" stroke="#52657a" stroke-width="3"/><line x1="345" y1="620" x2="345" y2="445" stroke="#52657a" stroke-width="3"/><line x1="805" y1="620" x2="820" y2="620" stroke="#ae2842" stroke-width="3"/><line x1="820" y1="620" x2="820" y2="355" stroke="#ae2842" stroke-width="3"/><line x1="820" y1="355" x2="850" y2="355" stroke="#ae2842" stroke-width="3"/><path d="M838.5914266954252,348.7674679981454 L850,355 L838.5914266954252,361.2325320018546" fill="none" stroke="#ae2842" stroke-width="3"/><text x="30" y="725" font-size="24" fill="#183047" text-anchor="start">負載電流：外部正極 → 舵機V+／內部負載 → GND → 外部負極。</text><text x="30" y="775" font-size="24" fill="#ae2842" text-anchor="start">外部正極不接3V3、5Vin、USB正極或GPIO。此圖不是實物腳序。</text></svg>
