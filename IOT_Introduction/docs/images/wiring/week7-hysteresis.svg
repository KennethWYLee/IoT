<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title>兩個門檻，留出不急著下結論的中間帶</title><desc>假設遮光raw較大；513／706是示例，不是所有模組的共同答案。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="640" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">兩個門檻，留出不急著下結論的中間帶</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">假設遮光raw較大；513／706是示例，不是所有模組的共同答案。</text><rect x="35" y="160" width="350" height="240" rx="12" fill="#e8f3ee" stroke="#bacbd7" stroke-width="2"/><rect x="405" y="160" width="365" height="240" rx="12" fill="#fff6df" stroke="#bacbd7" stroke-width="2"/><rect x="790" y="160" width="375" height="240" rx="12" fill="#e7eefb" stroke="#bacbd7" stroke-width="2"/><text x="210" y="220" font-size="31" fill="#087768" text-anchor="middle">raw ≤ 513</text><text x="210" y="293" font-size="27" fill="#087768" text-anchor="middle">候選：室內光</text><text x="210" y="360" font-size="24" fill="#183047" text-anchor="middle">持續150 ms才確認</text><text x="587" y="220" font-size="27" fill="#183047" text-anchor="middle">513 &lt; raw &lt; 706</text><text x="587" y="293" font-size="27" fill="#183047" text-anchor="middle">暫不確認新分類</text><text x="587" y="360" font-size="24" fill="#ae2842" text-anchor="middle">打斷候選的穩定計時</text><text x="977" y="220" font-size="31" fill="#1765ad" text-anchor="middle">raw ≥ 706</text><text x="977" y="293" font-size="27" fill="#1765ad" text-anchor="middle">候選：遮光</text><text x="977" y="360" font-size="24" fill="#183047" text-anchor="middle">持續150 ms才確認</text><text x="35" y="470" font-size="25" fill="#183047" text-anchor="start">示例：室內300～320、遮光900～920；兩組間隙再取三分點。</text><text x="35" y="530" font-size="25" fill="#ae2842" text-anchor="start">中間帶可顯示前一穩定類別，但settled=false：不能當新事件。</text><text x="35" y="590" font-size="24" fill="#183047" text-anchor="start">0／4095／缺值另行拒絕；更換場景要重新檢查基準，不代表測到lux。</text></svg>
