<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="780" viewBox="0 0 1320 780" role="img" aria-labelledby="title desc">
<title id="title">Sketch uses與Global variables：兩行在說不同空間</title><desc id="desc">對照Flash總量與程式分割區、RAM編譯配置及PSRAM，保留不同分母與時點。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style>
<rect width="1320" height="780" fill="white"/><text x="32" y="48" font-size="32" fill="#183047" text-anchor="start" font-weight="700">Sketch uses與Global variables：兩行在說不同空間</text><text x="32" y="92" font-size="23" fill="#183047" text-anchor="start" font-weight="400">Verify在電腦上產生編譯摘要；不是在讀取板子的即時記憶體占用。框格不按容量比例繪製。</text><rect x="28" y="128" width="662" height="510" rx="12" fill="#f4f8ff" stroke="#a6bdd8" stroke-width="2"/><text x="52" y="177" font-size="28" fill="#1765ad" text-anchor="start" font-weight="700">Flash：存放程式的「倉庫」</text><text x="52" y="225" font-size="24" fill="#183047" text-anchor="start" font-weight="400">BOARD-T01曾回報16,777,216 bytes</text><text x="52" y="265" font-size="24" fill="#183047" text-anchor="start" font-weight="400">實體Flash總容量；不是下方21%的分母。</text><rect x="53" y="303" width="611" height="303" rx="12" fill="white" stroke="#a6bdd8" stroke-width="2"/><text x="76" y="348" font-size="27" fill="#1765ad" text-anchor="start" font-weight="700">本次設定給程式的一間房間</text><text x="76" y="394" font-size="26" fill="#183047" text-anchor="start" font-weight="400">Maximum：1,310,720 bytes</text><text x="76" y="440" font-size="26" fill="#183047" text-anchor="start" font-weight="400">Sketch uses：286,973 bytes</text><rect x="78" y="471" width="557" height="29" rx="3" fill="#e4eaf1" stroke="#e4eaf1" stroke-width="2"/><rect x="78" y="471" width="121.95126419067383" height="29" rx="3" fill="#1765ad" stroke="#1765ad" stroke-width="2"/><text x="76" y="545" font-size="25" fill="#183047" text-anchor="start" font-weight="400">IDE顯示21%：相對這間房的上限。</text><text x="76" y="580" font-size="24" fill="#183047" text-anchor="start" font-weight="400">不是整棟16 MB倉庫占用21%。</text><rect x="715" y="128" width="579" height="350" rx="12" fill="#f2faf6" stroke="#9cc6b5" stroke-width="2"/><text x="741" y="177" font-size="28" fill="#087768" text-anchor="start" font-weight="700">RAM：執行時的「工作桌」</text><text x="741" y="227" font-size="25" fill="#183047" text-anchor="start" font-weight="400">摘要上限：327,680 bytes</text><text x="741" y="270" font-size="23" fill="#183047" text-anchor="start" font-weight="400">已計入靜態配置：21,936 bytes（6%）</text><text x="741" y="318" font-size="25" fill="#183047" text-anchor="start" font-weight="400">此階段剩餘：305,744 bytes</text><text x="741" y="370" font-size="23" fill="#183047" text-anchor="start" font-weight="400">程式跑起來還會使用暫存與動態空間。</text><text x="741" y="421" font-size="25" fill="#087768" text-anchor="start" font-weight="400">不是「執行時永遠只用6%」。</text><rect x="715" y="500" width="579" height="138" rx="12" fill="#fff8ed" stroke="#d8c399" stroke-width="2"/><text x="741" y="543" font-size="26" fill="#183047" text-anchor="start" font-weight="700">PSRAM：另外的記憶體配置</text><text x="741" y="588" font-size="23" fill="#183047" text-anchor="start" font-weight="400">本板曾回報8 MB；不是上面6%的分母。</text><text x="32" y="697" font-size="27" fill="#1765ad" text-anchor="start" font-weight="700">21%與6%不能相加：分母不同，儲存程式與執行時用的空間也不同。</text><text x="32" y="745" font-size="23" fill="#183047" text-anchor="start" font-weight="400">這是既有編譯紀錄的格式解讀。修改程式或設定後數字可能改變，不必追求同一個百分比。</text>
</svg>
