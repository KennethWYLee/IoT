<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="885" viewBox="0 0 1320 885" role="img" aria-labelledby="title desc">
<title id="title">從模組追到麵包板：三列、三個不同節點</title><desc id="desc">第3列為GND，第6列為3V3，第15列為S。a、c、e各接不同導線但同列同節點。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style>
<rect width="1320" height="885" fill="white"/><text x="32" y="48" font-size="32" fill="#183047" text-anchor="start" font-weight="700">從模組追到麵包板：三列、三個不同節點</text><text x="32" y="92" font-size="24" fill="#183047" text-anchor="start" font-weight="400">只畫本實驗使用的左半部a～e；同列有內部金屬片，不同列沒有直接橋接。</text><text x="435" y="144" font-size="26" fill="#183047" text-anchor="middle" font-weight="700">a</text><text x="500" y="144" font-size="26" fill="#183047" text-anchor="middle" font-weight="700">b</text><text x="565" y="144" font-size="26" fill="#183047" text-anchor="middle" font-weight="700">c</text><text x="630" y="144" font-size="26" fill="#183047" text-anchor="middle" font-weight="700">d</text><text x="695" y="144" font-size="26" fill="#183047" text-anchor="middle" font-weight="700">e</text><rect x="24" y="157" width="1268" height="155" rx="12" fill="#f7fafc" stroke="#ccd7e1" stroke-width="2"/><text x="44" y="207" font-size="25" fill="#183047" text-anchor="start" font-weight="700">ESP32 GND</text><text x="44" y="250" font-size="24" fill="#795548" text-anchor="start" font-weight="400">棕線 → a3</text><line x1="285" y1="230" x2="435" y2="230" stroke="#795548" stroke-width="4"/><text x="345" y="217" font-size="23" fill="#183047" text-anchor="start" font-weight="400">第3列</text><line x1="435" y1="230" x2="695" y2="230" stroke="#97a9b9" stroke-width="15"/><circle cx="435" cy="230" r="13" fill="white"/><circle cx="435" cy="230" r="5" fill="#183047"/><text x="435" y="278" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">a3</text><circle cx="500" cy="230" r="13" fill="white"/><circle cx="500" cy="230" r="5" fill="#183047"/><text x="500" y="278" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">b3</text><circle cx="565" cy="230" r="13" fill="white"/><circle cx="565" cy="230" r="5" fill="#183047"/><text x="565" y="278" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">c3</text><circle cx="630" cy="230" r="13" fill="white"/><circle cx="630" cy="230" r="5" fill="#183047"/><text x="630" y="278" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">d3</text><circle cx="695" cy="230" r="13" fill="white"/><circle cx="695" cy="230" r="5" fill="#183047"/><text x="695" y="278" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">e3</text><path d="M565 230V183H765" fill="none" stroke="#087768" stroke-width="3" stroke-linejoin="round"/><text x="782" y="187" font-size="24" fill="#087768" text-anchor="start" font-weight="400">綠線 → 模組−</text><text x="782" y="218" font-size="21" fill="#183047" text-anchor="start" font-weight="400">共同地，不是負電源</text><path d="M695 230H750V263H765" fill="none" stroke="#52657a" stroke-width="3" stroke-linejoin="round"/><text x="782" y="262" font-size="24" fill="#183047" text-anchor="start" font-weight="400">黑色延長線</text><text x="782" y="294" font-size="21" fill="#183047" text-anchor="start" font-weight="400">黑表筆的PGND測點</text><rect x="24" y="352" width="1268" height="155" rx="12" fill="#f7fafc" stroke="#ccd7e1" stroke-width="2"/><text x="44" y="402" font-size="25" fill="#183047" text-anchor="start" font-weight="700">ESP32 3V3</text><text x="44" y="445" font-size="24" fill="#ae2842" text-anchor="start" font-weight="400">紅線 → a6</text><line x1="285" y1="425" x2="435" y2="425" stroke="#ae2842" stroke-width="4"/><text x="345" y="412" font-size="23" fill="#183047" text-anchor="start" font-weight="400">第6列</text><line x1="435" y1="425" x2="695" y2="425" stroke="#97a9b9" stroke-width="15"/><circle cx="435" cy="425" r="13" fill="white"/><circle cx="435" cy="425" r="5" fill="#183047"/><text x="435" y="473" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">a6</text><circle cx="500" cy="425" r="13" fill="white"/><circle cx="500" cy="425" r="5" fill="#183047"/><text x="500" y="473" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">b6</text><circle cx="565" cy="425" r="13" fill="white"/><circle cx="565" cy="425" r="5" fill="#183047"/><text x="565" y="473" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">c6</text><circle cx="630" cy="425" r="13" fill="white"/><circle cx="630" cy="425" r="5" fill="#183047"/><text x="630" y="473" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">d6</text><circle cx="695" cy="425" r="13" fill="white"/><circle cx="695" cy="425" r="5" fill="#183047"/><text x="695" y="473" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">e6</text><path d="M565 425V378H765" fill="none" stroke="#087768" stroke-width="3" stroke-linejoin="round"/><text x="782" y="382" font-size="24" fill="#087768" text-anchor="start" font-weight="400">橘線 → 模組M</text><text x="782" y="413" font-size="21" fill="#183047" text-anchor="start" font-weight="400">M：已核對的中間供電腳</text><path d="M695 425H750V458H765" fill="none" stroke="#52657a" stroke-width="3" stroke-linejoin="round"/><text x="782" y="457" font-size="24" fill="#183047" text-anchor="start" font-weight="400">白色延長線</text><text x="782" y="489" font-size="21" fill="#183047" text-anchor="start" font-weight="400">只量3V3電源，不是S</text><rect x="24" y="547" width="1268" height="155" rx="12" fill="#f7fafc" stroke="#ccd7e1" stroke-width="2"/><text x="44" y="597" font-size="25" fill="#183047" text-anchor="start" font-weight="700">模組S</text><text x="44" y="640" font-size="24" fill="#a77700" text-anchor="start" font-weight="400">黃線 → a15</text><line x1="285" y1="620" x2="435" y2="620" stroke="#a77700" stroke-width="4"/><text x="345" y="607" font-size="23" fill="#183047" text-anchor="start" font-weight="400">第15列</text><line x1="435" y1="620" x2="695" y2="620" stroke="#97a9b9" stroke-width="15"/><circle cx="435" cy="620" r="13" fill="white"/><circle cx="435" cy="620" r="5" fill="#183047"/><text x="435" y="668" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">a15</text><circle cx="500" cy="620" r="13" fill="white"/><circle cx="500" cy="620" r="5" fill="#183047"/><text x="500" y="668" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">b15</text><circle cx="565" cy="620" r="13" fill="white"/><circle cx="565" cy="620" r="5" fill="#183047"/><text x="565" y="668" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">c15</text><circle cx="630" cy="620" r="13" fill="white"/><circle cx="630" cy="620" r="5" fill="#183047"/><text x="630" y="668" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">d15</text><circle cx="695" cy="620" r="13" fill="white"/><circle cx="695" cy="620" r="5" fill="#183047"/><text x="695" y="668" font-size="21" fill="#183047" text-anchor="middle" font-weight="400">e15</text><path d="M565 620V573H765" fill="none" stroke="#1765ad" stroke-width="3" stroke-linejoin="round"/><text x="782" y="577" font-size="24" fill="#1765ad" text-anchor="start" font-weight="400">藍線母頭先留空</text><text x="782" y="608" font-size="21" fill="#183047" text-anchor="start" font-weight="400">更換程式、斷電及profile確認後才接ADC</text><path d="M695 620H750V653H765" fill="none" stroke="#52657a" stroke-width="3" stroke-linejoin="round"/><text x="782" y="652" font-size="24" fill="#183047" text-anchor="start" font-weight="400">S測試延長線</text><text x="782" y="684" font-size="21" fill="#183047" text-anchor="start" font-weight="400">紅表筆量S時用這個端點</text><text x="32" y="760" font-size="25" fill="#1765ad" text-anchor="start" font-weight="700">a15、c15、e15是同一個S節點，不是把訊號逐段分壓。</text><text x="32" y="805" font-size="24" fill="#183047" text-anchor="start" font-weight="400">中央溝槽另一側f～j是另一組：f15不是S，除非另外接線；本實驗不跨過去。</text><text x="32" y="850" font-size="23" fill="#ae2842" text-anchor="start" font-weight="400">功能與座標示意，非板卡排針排列圖。所有改線都先拔USB，不能由線色決定功能。</text>
</svg>
