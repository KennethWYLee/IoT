<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title>連續的狀態，不等於重複的手勢</title><desc>各格為確認狀態的示例，並非每格固定相同時間。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="640" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">連續的狀態，不等於重複的手勢</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">各格為確認狀態的示例，並非每格固定相同時間。</text><rect x="30" y="175" width="180" height="290" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="120" y="235" font-size="27" fill="#183047" text-anchor="middle">未遮</text><text x="120" y="315" font-size="25" fill="#1765ad" text-anchor="middle">armed</text><text x="120" y="404" font-size="24" fill="#52657a" text-anchor="middle">無新事件</text><rect x="225" y="175" width="180" height="290" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="315" y="235" font-size="27" fill="#087768" text-anchor="middle">新遮光</text><text x="315" y="315" font-size="25" fill="#1765ad" text-anchor="middle">用掉</text><text x="315" y="404" font-size="24" fill="#087768" text-anchor="middle">事件 +1</text><rect x="420" y="175" width="180" height="290" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="510" y="235" font-size="27" fill="#183047" text-anchor="middle">持續遮</text><text x="510" y="315" font-size="25" fill="#1765ad" text-anchor="middle">未準備</text><text x="510" y="404" font-size="24" fill="#52657a" text-anchor="middle">無新事件</text><rect x="615" y="175" width="180" height="290" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="705" y="235" font-size="27" fill="#183047" text-anchor="middle">持續遮</text><text x="705" y="315" font-size="25" fill="#1765ad" text-anchor="middle">未準備</text><text x="705" y="404" font-size="24" fill="#52657a" text-anchor="middle">無新事件</text><rect x="810" y="175" width="180" height="290" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="900" y="235" font-size="27" fill="#183047" text-anchor="middle">放開</text><text x="900" y="315" font-size="25" fill="#1765ad" text-anchor="middle">rearm</text><text x="900" y="404" font-size="24" fill="#52657a" text-anchor="middle">無新事件</text><rect x="1005" y="175" width="180" height="290" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="1095" y="235" font-size="27" fill="#087768" text-anchor="middle">再遮光</text><text x="1095" y="315" font-size="25" fill="#1765ad" text-anchor="middle">用掉</text><text x="1095" y="404" font-size="24" fill="#087768" text-anchor="middle">事件 +1</text><text x="30" y="530" font-size="25" fill="#183047" text-anchor="start">圖中+1表示一個新事件，不是必定加分；遊戲還要看當時紅／綠燈。</text><text x="30" y="590" font-size="24" fill="#ae2842" text-anchor="start">一秒可取得很多筆SHADE，但沒有「放開→再遮」就沒有第二個新事件。</text></svg>
