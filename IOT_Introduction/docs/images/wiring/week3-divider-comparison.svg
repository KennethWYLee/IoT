<svg xmlns="http://www.w3.org/2000/svg" width="1395" height="820" viewBox="0 0 1395 820" role="img" aria-labelledby="title desc">
<title id="title">分壓分的是兩段電壓差，不是把電流分成兩半</title><desc id="desc">10k與10k、20k、1k三種理想模型，對照S電位、電流及上下兩段電壓差。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style>
<rect width="1395" height="820" fill="white"/><text x="32" y="48" font-size="32" fill="#183047" text-anchor="start" font-weight="700">分壓分的是兩段電壓差，不是把電流分成兩半</text><text x="32" y="92" font-size="23" fill="#183047" text-anchor="start" font-weight="400">三欄皆為理想計算：上方固定10 kΩ、供電3.3 V，忽略量測負載。不是新增三種光線實驗。</text><rect x="25" y="127" width="432" height="555" rx="12" fill="#f3f7fb" stroke="#ccd7e1" stroke-width="2"/><text x="45" y="167" font-size="25" fill="#183047" text-anchor="start" font-weight="700">下方光敏電阻假設為 10 kΩ</text><text x="115" y="213" font-size="25" fill="#ae2842" text-anchor="middle" font-weight="400">3.30 V</text><line x1="115" y1="226" x2="115" y2="263" stroke="#ae2842" stroke-width="4"/><rect x="90" y="263" width="50" height="73" rx="3" fill="#fff5d9" stroke="#ad914f" stroke-width="2"/><text x="167" y="291" font-size="23" fill="#183047" text-anchor="start" font-weight="400">固定10 kΩ</text><text x="167" y="324" font-size="24" fill="#183047" text-anchor="start" font-weight="400">兩端差 1.65 V</text><line x1="115" y1="336" x2="115" y2="401" stroke="#1765ad" stroke-width="4"/><circle cx="115" cy="369" r="6" fill="#1765ad"/><text x="167" y="378" font-size="28" fill="#1765ad" text-anchor="start" font-weight="700">S = 1.65 V</text><rect x="90" y="401" width="50" height="73" rx="3" fill="#fff5d9" stroke="#ad914f" stroke-width="2"/><text x="167" y="429" font-size="23" fill="#183047" text-anchor="start" font-weight="400">光敏 10 kΩ</text><text x="167" y="462" font-size="24" fill="#183047" text-anchor="start" font-weight="400">兩端差 1.65 V</text><line x1="115" y1="474" x2="115" y2="518" stroke="#087768" stroke-width="4"/><circle cx="115" cy="518" r="6" fill="#087768"/><text x="167" y="527" font-size="24" fill="#087768" text-anchor="start" font-weight="400">GND = 0 V</text><text x="45" y="589" font-size="24" fill="#183047" text-anchor="start" font-weight="400">整條串聯電流：0.165 mA</text><text x="45" y="631" font-size="25" fill="#1765ad" text-anchor="start" font-weight="400">1.65 + 1.65 = 3.30 V</text><rect x="479" y="127" width="432" height="555" rx="12" fill="#f3f7fb" stroke="#ccd7e1" stroke-width="2"/><text x="499" y="167" font-size="25" fill="#183047" text-anchor="start" font-weight="700">下方光敏電阻假設為 20 kΩ</text><text x="569" y="213" font-size="25" fill="#ae2842" text-anchor="middle" font-weight="400">3.30 V</text><line x1="569" y1="226" x2="569" y2="263" stroke="#ae2842" stroke-width="4"/><rect x="544" y="263" width="50" height="73" rx="3" fill="#fff5d9" stroke="#ad914f" stroke-width="2"/><text x="621" y="291" font-size="23" fill="#183047" text-anchor="start" font-weight="400">固定10 kΩ</text><text x="621" y="324" font-size="24" fill="#183047" text-anchor="start" font-weight="400">兩端差 1.10 V</text><line x1="569" y1="336" x2="569" y2="401" stroke="#1765ad" stroke-width="4"/><circle cx="569" cy="369" r="6" fill="#1765ad"/><text x="621" y="378" font-size="28" fill="#1765ad" text-anchor="start" font-weight="700">S = 2.20 V</text><rect x="544" y="401" width="50" height="73" rx="3" fill="#fff5d9" stroke="#ad914f" stroke-width="2"/><text x="621" y="429" font-size="23" fill="#183047" text-anchor="start" font-weight="400">光敏 20 kΩ</text><text x="621" y="462" font-size="24" fill="#183047" text-anchor="start" font-weight="400">兩端差 2.20 V</text><line x1="569" y1="474" x2="569" y2="518" stroke="#087768" stroke-width="4"/><circle cx="569" cy="518" r="6" fill="#087768"/><text x="621" y="527" font-size="24" fill="#087768" text-anchor="start" font-weight="400">GND = 0 V</text><text x="499" y="589" font-size="24" fill="#183047" text-anchor="start" font-weight="400">整條串聯電流：0.110 mA</text><text x="499" y="631" font-size="25" fill="#1765ad" text-anchor="start" font-weight="400">1.10 + 2.20 = 3.30 V</text><rect x="933" y="127" width="432" height="555" rx="12" fill="#f3f7fb" stroke="#ccd7e1" stroke-width="2"/><text x="953" y="167" font-size="25" fill="#183047" text-anchor="start" font-weight="700">下方光敏電阻假設為 1 kΩ</text><text x="1023" y="213" font-size="25" fill="#ae2842" text-anchor="middle" font-weight="400">3.30 V</text><line x1="1023" y1="226" x2="1023" y2="263" stroke="#ae2842" stroke-width="4"/><rect x="998" y="263" width="50" height="73" rx="3" fill="#fff5d9" stroke="#ad914f" stroke-width="2"/><text x="1075" y="291" font-size="23" fill="#183047" text-anchor="start" font-weight="400">固定10 kΩ</text><text x="1075" y="324" font-size="24" fill="#183047" text-anchor="start" font-weight="400">兩端差 3.00 V</text><line x1="1023" y1="336" x2="1023" y2="401" stroke="#1765ad" stroke-width="4"/><circle cx="1023" cy="369" r="6" fill="#1765ad"/><text x="1075" y="378" font-size="28" fill="#1765ad" text-anchor="start" font-weight="700">S = 0.30 V</text><rect x="998" y="401" width="50" height="73" rx="3" fill="#fff5d9" stroke="#ad914f" stroke-width="2"/><text x="1075" y="429" font-size="23" fill="#183047" text-anchor="start" font-weight="400">光敏 1 kΩ</text><text x="1075" y="462" font-size="24" fill="#183047" text-anchor="start" font-weight="400">兩端差 0.30 V</text><line x1="1023" y1="474" x2="1023" y2="518" stroke="#087768" stroke-width="4"/><circle cx="1023" cy="518" r="6" fill="#087768"/><text x="1075" y="527" font-size="24" fill="#087768" text-anchor="start" font-weight="400">GND = 0 V</text><text x="953" y="589" font-size="24" fill="#183047" text-anchor="start" font-weight="400">整條串聯電流：0.300 mA</text><text x="953" y="631" font-size="25" fill="#1765ad" text-anchor="start" font-weight="400">3.00 + 0.30 = 3.30 V</text><text x="32" y="736" font-size="26" fill="#1765ad" text-anchor="start" font-weight="700">供電不變，S也能改變；決定位置的是「下方電阻／總電阻」的比例。</text><text x="32" y="783" font-size="24" fill="#183047" text-anchor="start" font-weight="400">同一顆10 kΩ不會固定扣掉1.65 V。只知道3.3 V與一顆電阻，還不能求出S。</text>
</svg>
