<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="725" viewBox="0 0 1200 725" role="img"><title>四條線，兩種責任：供電與通訊</title><desc>功能圖，不是OLED模組實拍，也不是未驗證腳位的接線答案。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="725" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">四條線，兩種責任：供電與通訊</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">功能圖，不是OLED模組實拍，也不是未驗證腳位的接線答案。</text><rect x="30" y="145" width="290" height="440" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><rect x="850" y="145" width="320" height="440" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="65" y="190" font-size="30" fill="#1765ad" text-anchor="start">ESP32</text><text x="890" y="190" font-size="27" fill="#087768" text-anchor="start">核准I2C OLED</text><text x="55" y="265" font-size="26" fill="#ae2842" text-anchor="start">3V3</text><text x="885" y="265" font-size="26" fill="#ae2842" text-anchor="start">VCC</text><line x1="320" y1="257" x2="850" y2="257" stroke="#ae2842" stroke-width="3"/><text x="590" y="238" font-size="23" fill="#ae2842" text-anchor="middle">供電，僅限3.3 V相容模組</text><text x="55" y="350" font-size="26" fill="#183047" text-anchor="start">GND</text><text x="885" y="350" font-size="26" fill="#183047" text-anchor="start">GND</text><line x1="320" y1="342" x2="850" y2="342" stroke="#183047" stroke-width="3"/><text x="590" y="323" font-size="23" fill="#183047" text-anchor="middle">共同參考地</text><text x="55" y="435" font-size="26" fill="#1765ad" text-anchor="start">SDA GPIO</text><text x="885" y="435" font-size="26" fill="#1765ad" text-anchor="start">SDA</text><line x1="320" y1="427" x2="850" y2="427" stroke="#1765ad" stroke-width="3"/><text x="590" y="408" font-size="23" fill="#1765ad" text-anchor="middle">資料與裝置回應</text><text x="55" y="520" font-size="26" fill="#087768" text-anchor="start">SCL GPIO</text><text x="885" y="520" font-size="26" fill="#087768" text-anchor="start">SCL</text><line x1="320" y1="512" x2="850" y2="512" stroke="#087768" stroke-width="3"/><text x="590" y="493" font-size="23" fill="#087768" text-anchor="middle">通訊時脈</text><text x="30" y="636" font-size="26" fill="#183047" text-anchor="start">SDA／SCL不是兩條電源；各自需要核准且不同的GPIO。</text><text x="30" y="683" font-size="24" fill="#ae2842" text-anchor="start">供電、拉高電壓、腳序、控制器與解析度先核對，不依此圖上下接線。</text></svg>
