<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="685" viewBox="0 0 1200 685" role="img"><title>同一顆電阻，換量程要連單位一起讀</title><desc>220 Ω的理想顯示示例，非實測；實表可能有OL、左側1或不同小數位。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="685" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">同一顆電阻，換量程要連單位一起讀</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">220 Ω的理想顯示示例，非實測；實表可能有OL、左側1或不同小數位。</text><rect x="25" y="135" width="375" height="350" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="47" y="180" font-size="29" fill="#1765ad" text-anchor="start">200 Ω檔</text><rect x="45" y="206" width="335" height="95" rx="12" fill="#e4ecd8" stroke="#bccbd8" stroke-width="2"/><text x="212" y="270" font-size="38" fill="#183047" text-anchor="middle">1 / OL</text><text x="43" y="355" font-size="23" fill="#183047" text-anchor="start">220 Ω可能超量程</text><text x="43" y="411" font-size="23" fill="#183047" text-anchor="start">不是「1 Ω」</text><rect x="418" y="135" width="375" height="350" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="440" y="180" font-size="29" fill="#1765ad" text-anchor="start">2 kΩ檔</text><rect x="438" y="206" width="335" height="95" rx="12" fill="#e4ecd8" stroke="#bccbd8" stroke-width="2"/><text x="605" y="270" font-size="38" fill="#183047" text-anchor="middle">220 Ω</text><text x="436" y="355" font-size="23" fill="#183047" text-anchor="start">此圖直接寫出單位</text><text x="436" y="411" font-size="23" fill="#183047" text-anchor="start">實際LCD依表型號</text><rect x="811" y="135" width="375" height="350" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="833" y="180" font-size="29" fill="#1765ad" text-anchor="start">20 kΩ檔</text><rect x="831" y="206" width="335" height="95" rx="12" fill="#e4ecd8" stroke="#bccbd8" stroke-width="2"/><text x="998" y="270" font-size="38" fill="#183047" text-anchor="middle">0.22 kΩ</text><text x="829" y="355" font-size="23" fill="#183047" text-anchor="start">0.22 × 1000 = 220 Ω</text><text x="829" y="411" font-size="23" fill="#183047" text-anchor="start">較粗顯示可能隱藏差異</text><text x="30" y="543" font-size="24" fill="#183047" text-anchor="start">模擬LCD：圖上的單位用來教判讀，不宣稱所有A830L版本都這樣顯示。</text><text x="30" y="596" font-size="24" fill="#183047" text-anchor="start">330 Ω同理；先確認Ω功能。換量程改變可讀範圍／細節，不改變電阻本身。</text><text x="30" y="649" font-size="24" fill="#ae2842" text-anchor="start">沒有外部供電；電阻與其他支路分離。不要用10A孔或電流檔。</text></svg>
