<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img"><title>相對門檻：只在本地條件下比較</title><desc>橫軸為raw，彩色線是這次各條件觀察區間，不是未來所有可能值。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="730" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">相對門檻：只在本地條件下比較</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">橫軸為raw，彩色線是這次各條件觀察區間，不是未來所有可能值。</text><line x1="100" y1="440" x2="1100" y2="440" stroke="#52657a" stroke-width="3"/><line x1="100" y1="433" x2="100" y2="449" stroke="#52657a" stroke-width="3"/><text x="100" y="478" font-size="22" fill="#183047" text-anchor="middle">0</text><line x1="266" y1="433" x2="266" y2="449" stroke="#52657a" stroke-width="3"/><text x="266" y="478" font-size="22" fill="#183047" text-anchor="middle">200</text><line x1="432" y1="433" x2="432" y2="449" stroke="#52657a" stroke-width="3"/><text x="432" y="478" font-size="22" fill="#183047" text-anchor="middle">400</text><line x1="598" y1="433" x2="598" y2="449" stroke="#52657a" stroke-width="3"/><text x="598" y="478" font-size="22" fill="#183047" text-anchor="middle">600</text><line x1="764" y1="433" x2="764" y2="449" stroke="#52657a" stroke-width="3"/><text x="764" y="478" font-size="22" fill="#183047" text-anchor="middle">800</text><line x1="930" y1="433" x2="930" y2="449" stroke="#52657a" stroke-width="3"/><text x="930" y="478" font-size="22" fill="#183047" text-anchor="middle">1000</text><line x1="1096" y1="433" x2="1096" y2="449" stroke="#52657a" stroke-width="3"/><text x="1096" y="478" font-size="22" fill="#183047" text-anchor="middle">1200</text><text x="40" y="177" font-size="26" fill="#1765ad" text-anchor="start">室內光：300～320</text><line x1="349" y1="220" x2="365.59999999999997" y2="220" stroke="#1765ad" stroke-width="18"/><circle cx="349" cy="220" r="6" fill="#1765ad"/><circle cx="365.59999999999997" cy="220" r="6" fill="#1765ad"/><text x="40" y="297" font-size="26" fill="#087768" text-anchor="start">遮光：900～920</text><line x1="847" y1="340" x2="863.5999999999999" y2="340" stroke="#087768" stroke-width="18"/><circle cx="847" cy="340" r="6" fill="#087768"/><circle cx="863.5999999999999" cy="340" r="6" fill="#087768"/><line x1="606.3" y1="170" x2="606.3" y2="440" stroke="#ae2842" stroke-width="3"/><text x="606.3" y="149" font-size="28" fill="#ae2842" text-anchor="middle">610</text><text x="30" y="542" font-size="30" fill="#1765ad" text-anchor="start">門檻 = (320 + 900) ÷ 2 = 610</text><text x="30" y="590" font-size="26" fill="#183047" text-anchor="start">raw ≤ 610 → INDOOR；raw &gt; 610 → SHADE（本例方向）。</text><text x="30" y="641" font-size="24" fill="#ae2842" text-anchor="start">用另一輪新資料驗證；落在空隙也不等於曾有充分校正資料。</text><text x="30" y="690" font-size="24" fill="#52657a" text-anchor="start">raw是ADC原始碼，無電壓／照度單位；數據為教學示例。</text></svg>
