<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>光線狀態沒變，換燈色不會重新算一次</title><desc>示例起始count=3；圖中遮光維持到換色之後。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="720" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">光線狀態沒變，換燈色不會重新算一次</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">示例起始count=3；圖中遮光維持到換色之後。</text><rect x="35" y="155" width="1130" height="200" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="60" y="204" font-size="28" fill="#ae2842" text-anchor="start">紅 → 綠</text><text x="60" y="269" font-size="24" fill="#183047" text-anchor="start">在紅燈新遮一次，保持到綠</text><rect x="585" y="180" width="220" height="140" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="695" y="237" font-size="32" fill="#ae2842" text-anchor="middle">3 → 2</text><text x="695" y="287" font-size="23" fill="#183047" text-anchor="middle">新遮光事件</text><line x1="810" y1="248" x2="865" y2="248" stroke="#1765ad" stroke-width="3"/><path d="M853.5914266954252,241.76746799814535 L865,248 L853.5914266954252,254.23253200185465" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="870" y="180" width="255" height="140" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="997" y="237" font-size="32" fill="#087768" text-anchor="middle">仍是2</text><text x="997" y="287" font-size="21" fill="#183047" text-anchor="middle">只有換色，沒有新事件</text><rect x="35" y="385" width="1130" height="200" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="60" y="434" font-size="28" fill="#087768" text-anchor="start">綠 → 紅</text><text x="60" y="499" font-size="24" fill="#183047" text-anchor="start">在綠燈新遮一次，保持到紅</text><rect x="585" y="410" width="220" height="140" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="695" y="467" font-size="32" fill="#087768" text-anchor="middle">3 → 4</text><text x="695" y="517" font-size="23" fill="#183047" text-anchor="middle">新遮光事件</text><line x1="810" y1="478" x2="865" y2="478" stroke="#1765ad" stroke-width="3"/><path d="M853.5914266954252,471.7674679981454 L865,478 L853.5914266954252,484.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="870" y="410" width="255" height="140" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="997" y="467" font-size="32" fill="#ae2842" text-anchor="middle">仍是4</text><text x="997" y="517" font-size="21" fill="#183047" text-anchor="middle">只有換色，沒有新事件</text><text x="35" y="675" font-size="24" fill="#183047" text-anchor="start">下一次計分：先穩定移開，再形成新的穩定遮光。放開本身不加不扣。</text></svg>
