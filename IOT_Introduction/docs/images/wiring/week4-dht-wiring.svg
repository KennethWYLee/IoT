<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>DHT11需要供電、共同GND與DATA三種功能</title><desc>功能示意，不是本片模組腳序或已完成的實機驗證；不使用5Vin。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="760" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">DHT11需要供電、共同GND與DATA三種功能</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">功能示意，不是本片模組腳序或已完成的實機驗證；不使用5Vin。</text><rect x="30" y="140" width="300" height="420" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><rect x="850" y="140" width="320" height="420" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="65" y="188" font-size="29" fill="#1765ad" text-anchor="start">ESP32排針</text><text x="882" y="188" font-size="27" fill="#087768" text-anchor="start">DHT11功能接點</text><text x="55" y="265" font-size="26" fill="#ae2842" text-anchor="start">3V3</text><text x="890" y="265" font-size="27" fill="#ae2842" text-anchor="start">VCC</text><line x1="330" y1="258" x2="850" y2="258" stroke="#ae2842" stroke-width="4"/><text x="590" y="235" font-size="25" fill="#ae2842" text-anchor="middle">a6 ↔ c6</text><text x="590" y="293" font-size="22" fill="#52657a" text-anchor="middle">兩段公對母</text><text x="55" y="385" font-size="26" fill="#183047" text-anchor="start">GND</text><text x="890" y="385" font-size="27" fill="#183047" text-anchor="start">GND</text><line x1="330" y1="378" x2="850" y2="378" stroke="#183047" stroke-width="4"/><text x="590" y="355" font-size="25" fill="#183047" text-anchor="middle">a3 ↔ c3</text><text x="590" y="413" font-size="22" fill="#52657a" text-anchor="middle">兩段公對母</text><text x="55" y="505" font-size="26" fill="#1765ad" text-anchor="start">DHT_GPIO</text><text x="890" y="505" font-size="27" fill="#1765ad" text-anchor="start">DATA</text><line x1="330" y1="498" x2="850" y2="498" stroke="#1765ad" stroke-width="4"/><text x="590" y="475" font-size="25" fill="#1765ad" text-anchor="middle">直接一條母對母</text><text x="590" y="533" font-size="22" fill="#52657a" text-anchor="middle">雙向時序資料</text><text x="30" y="614" font-size="25" fill="#ae2842" text-anchor="start">前提：三腳、3.3 V供電、DATA上拉／邏輯電壓與GPIO均已核准。</text><text x="30" y="665" font-size="25" fill="#183047" text-anchor="start">DATA兩端都是排針，所以兩端用母頭；不是為了用線而繞接麵包板。</text><text x="30" y="716" font-size="24" fill="#ae2842" text-anchor="start">方框內上下位置不代表實物腳序。未核准：保持斷電，不把旗標改true。</text></svg>
