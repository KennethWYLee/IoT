<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="765" viewBox="0 0 1200 765" role="img"><title>同樣有訊號線，讀法卻不同</title><desc>資料流程示意，非量測波形；數位通訊仍可能發生讀取失敗。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="765" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">同樣有訊號線，讀法卻不同</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">資料流程示意，非量測波形；數位通訊仍可能發生讀取失敗。</text><rect x="30" y="150" width="1140" height="222" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="55" y="193" font-size="30" fill="#1765ad" text-anchor="start">KY-018</text><rect x="55" y="217" width="333" height="68" rx="12" fill="white" stroke="#bccbd8" stroke-width="2"/><text x="221" y="260" font-size="25" fill="#183047" text-anchor="middle">S對GND的電壓</text><line x1="390" y1="251" x2="428" y2="251" stroke="#1765ad" stroke-width="4"/><path d="M 418 244 L 428 251 L 418 258" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="433" y="217" width="333" height="68" rx="12" fill="white" stroke="#bccbd8" stroke-width="2"/><text x="599" y="260" font-size="25" fill="#183047" text-anchor="middle">ESP32 ADC</text><line x1="768" y1="251" x2="806" y2="251" stroke="#1765ad" stroke-width="4"/><path d="M 796 244 L 806 251 L 796 258" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="811" y="217" width="333" height="68" rx="12" fill="white" stroke="#bccbd8" stroke-width="2"/><text x="977" y="260" font-size="25" fill="#183047" text-anchor="middle">raw：0～4095</text><text x="55" y="333" font-size="26" fill="#183047" text-anchor="start">再以本地基準比較</text><rect x="30" y="410" width="1140" height="222" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="55" y="453" font-size="30" fill="#087768" text-anchor="start">DHT11</text><rect x="55" y="477" width="333" height="68" rx="12" fill="white" stroke="#bccbd8" stroke-width="2"/><text x="221" y="520" font-size="25" fill="#183047" text-anchor="middle">DATA高低時序</text><line x1="390" y1="511" x2="428" y2="511" stroke="#1765ad" stroke-width="4"/><path d="M 418 504 L 428 511 L 418 518" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="433" y="477" width="333" height="68" rx="12" fill="white" stroke="#bccbd8" stroke-width="2"/><text x="599" y="520" font-size="25" fill="#183047" text-anchor="middle">DHT library</text><line x1="768" y1="511" x2="806" y2="511" stroke="#1765ad" stroke-width="4"/><path d="M 796 504 L 806 511 L 796 518" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="811" y="477" width="333" height="68" rx="12" fill="white" stroke="#bccbd8" stroke-width="2"/><text x="977" y="520" font-size="25" fill="#183047" text-anchor="middle">°C、%RH 或NaN</text><text x="55" y="593" font-size="26" fill="#183047" text-anchor="start">再檢查來源與品質</text><text x="30" y="723" font-size="24" fill="#ae2842" text-anchor="start">共同GND提供準位參考；DHT DATA的直流平均V不是溫度，也不是濕度。</text></svg>
