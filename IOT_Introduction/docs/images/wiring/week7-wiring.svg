<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="875" viewBox="0 0 1200 875" role="img"><title>低功率正極與舵機正極分離，共同地相接</title><desc>每個GPIO只負責一項功能；不同模組的供電與腳位不可由顏色猜測。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="875" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">低功率正極與舵機正極分離，共同地相接</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">每個GPIO只負責一項功能；不同模組的供電與腳位不可由顏色猜測。</text><rect x="35" y="145" width="335" height="455" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="202" y="202" font-size="28" fill="#1765ad" text-anchor="middle">ESP32低功率區</text><text x="65" y="284" font-size="27" fill="#ae2842" text-anchor="start">3V3 → a6</text><text x="65" y="364" font-size="27" fill="#183047" text-anchor="start">GND → a3</text><text x="65" y="444" font-size="26" fill="#1765ad" text-anchor="start">各獨立核准GPIO</text><text x="65" y="528" font-size="26" fill="#183047" text-anchor="start">USB供板卡</text><rect x="780" y="145" width="385" height="255" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="972" y="202" font-size="26" fill="#1765ad" text-anchor="middle">KY／RGB／OLED／按鈕</text><text x="972" y="280" font-size="24" fill="#183047" text-anchor="middle">供電、參考地與訊號分開</text><text x="972" y="348" font-size="24" fill="#ae2842" text-anchor="middle">依模組profile核對腳序</text><line x1="370" y1="270" x2="780" y2="270" stroke="#ae2842" stroke-width="3"/><line x1="370" y1="354" x2="780" y2="354" stroke="#52657a" stroke-width="3"/><line x1="370" y1="433" x2="735" y2="433" stroke="#1765ad" stroke-width="3"/><line x1="735" y1="433" x2="735" y2="310" stroke="#1765ad" stroke-width="3"/><line x1="735" y1="310" x2="780" y2="310" stroke="#1765ad" stroke-width="3"/><path d="M768.5914266954252,303.7674679981454 L780,310 L768.5914266954252,316.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="780" y="475" width="385" height="165" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="972" y="530" font-size="26" fill="#087768" text-anchor="middle">SG90 signal／V+／GND</text><text x="972" y="590" font-size="24" fill="#ae2842" text-anchor="middle">外部正極只進舵機供電</text><line x1="665" y1="435" x2="665" y2="520" stroke="#1765ad" stroke-width="3"/><line x1="665" y1="520" x2="780" y2="520" stroke="#1765ad" stroke-width="3"/><path d="M768.5914266954252,513.7674679981453 L780,520 L768.5914266954252,526.2325320018547" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="395" y="655" width="655" height="115" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="720" y="699" font-size="27" fill="#ae2842" text-anchor="middle">核准外部電源：正極 → 舵機V+</text><text x="720" y="746" font-size="25" fill="#183047" text-anchor="middle">負極 → 舵機GND ＋ ESP32共同地</text><text x="35" y="826" font-size="23" fill="#183047" text-anchor="start">功能分區圖，非全部線材實物圖；蜂鳴器依Week 4核准控制與供電，不畫猜測腳序。</text></svg>
