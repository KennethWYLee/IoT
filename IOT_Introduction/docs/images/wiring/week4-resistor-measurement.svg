<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img"><title>把量測端固定，比同時捏住兩根表筆容易</title><desc>節點示意，非按孔比例的實物照片；所有插線在外部電源分離後進行。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="710" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">把量測端固定，比同時捏住兩根表筆容易</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">節點示意，非按孔比例的實物照片；所有插線在外部電源分離後進行。</text><rect x="40" y="140" width="590" height="430" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="65" y="185" font-size="26" fill="#1765ad" text-anchor="start">隔離的麵包板左半區 a～e</text><text x="160" y="235" font-size="24" fill="#183047" text-anchor="middle">a</text><text x="245" y="235" font-size="24" fill="#183047" text-anchor="middle">b</text><text x="330" y="235" font-size="24" fill="#183047" text-anchor="middle">c</text><text x="415" y="235" font-size="24" fill="#183047" text-anchor="middle">d</text><text x="500" y="235" font-size="24" fill="#183047" text-anchor="middle">e</text><text x="80" y="318" font-size="24" fill="#183047" text-anchor="start">列20</text><line x1="160" y1="310" x2="500" y2="310" stroke="#087768" stroke-width="9"/><circle cx="160" cy="310" r="6" fill="#183047"/><circle cx="245" cy="310" r="6" fill="#183047"/><circle cx="330" cy="310" r="6" fill="#183047"/><circle cx="415" cy="310" r="6" fill="#183047"/><circle cx="500" cy="310" r="6" fill="#183047"/><text x="80" y="498" font-size="24" fill="#183047" text-anchor="start">列25</text><line x1="160" y1="490" x2="500" y2="490" stroke="#087768" stroke-width="9"/><circle cx="160" cy="490" r="6" fill="#183047"/><circle cx="245" cy="490" r="6" fill="#183047"/><circle cx="330" cy="490" r="6" fill="#183047"/><circle cx="415" cy="490" r="6" fill="#183047"/><circle cx="500" cy="490" r="6" fill="#183047"/><line x1="245" y1="310" x2="245" y2="355" stroke="#52657a" stroke-width="3"/><rect x="224" y="355" width="42" height="84" rx="12" fill="#f7e4b4" stroke="#bccbd8" stroke-width="2"/><line x1="245" y1="439" x2="245" y2="490" stroke="#52657a" stroke-width="3"/><text x="298" y="388" font-size="25" fill="#183047" text-anchor="start">電阻：b20 ↔ b25</text><text x="298" y="426" font-size="24" fill="#183047" text-anchor="start">220 Ω或330 Ω</text><line x1="500" y1="310" x2="790" y2="310" stroke="#ae2842" stroke-width="3"/><line x1="500" y1="490" x2="790" y2="490" stroke="#183047" stroke-width="3"/><rect x="790" y="260" width="360" height="285" rx="12" fill="#edf2f4" stroke="#bccbd8" stroke-width="2"/><text x="970" y="304" font-size="30" fill="#1765ad" text-anchor="middle">電表 Ω</text><text x="970" y="365" font-size="26" fill="#183047" text-anchor="middle">跨在電阻兩端</text><text x="818" y="417" font-size="24" fill="#ae2842" text-anchor="start">紅：e20延長端</text><text x="818" y="466" font-size="24" fill="#183047" text-anchor="start">黑：e25延長端</text><text x="30" y="620" font-size="24" fill="#183047" text-anchor="start">同列b20與e20相通；b25與e25相通。第20列與第25列只經電阻相連。</text><text x="30" y="668" font-size="24" fill="#ae2842" text-anchor="start">沒有ESP32、USB、3V3或GND供電線。電表用自己的測試電路量阻值。</text></svg>
