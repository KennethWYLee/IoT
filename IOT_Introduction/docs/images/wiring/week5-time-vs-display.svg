<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="705" viewBox="0 0 1200 705" role="img"><title>時鐘是一條時間軸，畫面只是間隔取出的快照</title><desc>假設更新時刻示例，不是ESP32精準排程或顯示延遲的實測。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="705" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">時鐘是一條時間軸，畫面只是間隔取出的快照</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">假設更新時刻示例，不是ESP32精準排程或顯示延遲的實測。</text><rect x="30" y="155" width="280" height="340" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="170" y="201" font-size="30" fill="#1765ad" text-anchor="middle">0 s</text><text x="170" y="252" font-size="26" fill="#183047" text-anchor="middle">起點</text><text x="170" y="321" font-size="27" fill="#087768" text-anchor="middle">30000 ms</text><text x="170" y="401" font-size="29" fill="#183047" text-anchor="middle">顯示 30</text><line x1="312" y1="470" x2="324" y2="470" stroke="#1765ad" stroke-width="3"/><path d="M312.5914266954251,463.7674679981454 L324,470 L312.5914266954251,476.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="326" y="155" width="280" height="340" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="466" y="201" font-size="30" fill="#1765ad" text-anchor="middle">0.8 s</text><text x="466" y="252" font-size="26" fill="#183047" text-anchor="middle">更新1</text><text x="466" y="321" font-size="27" fill="#087768" text-anchor="middle">29200 ms</text><text x="466" y="401" font-size="29" fill="#183047" text-anchor="middle">顯示 30</text><line x1="608" y1="470" x2="620" y2="470" stroke="#1765ad" stroke-width="3"/><path d="M608.5914266954252,463.7674679981454 L620,470 L608.5914266954252,476.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="622" y="155" width="280" height="340" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="762" y="201" font-size="30" fill="#1765ad" text-anchor="middle">2.1 s</text><text x="762" y="252" font-size="26" fill="#183047" text-anchor="middle">更新2</text><text x="762" y="321" font-size="27" fill="#087768" text-anchor="middle">27900 ms</text><text x="762" y="401" font-size="29" fill="#183047" text-anchor="middle">顯示 28</text><line x1="904" y1="470" x2="916" y2="470" stroke="#1765ad" stroke-width="3"/><path d="M904.5914266954252,463.7674679981454 L916,470 L904.5914266954252,476.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="918" y="155" width="280" height="340" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="1058" y="201" font-size="30" fill="#1765ad" text-anchor="middle">3.6 s</text><text x="1058" y="252" font-size="26" fill="#183047" text-anchor="middle">更新3</text><text x="1058" y="321" font-size="27" fill="#087768" text-anchor="middle">26400 ms</text><text x="1058" y="401" font-size="29" fill="#183047" text-anchor="middle">顯示 27</text><text x="30" y="551" font-size="26" fill="#087768" text-anchor="start">正確：每次用「目前時間 − 開始時間」算，不管畫面刷新幾次。</text><text x="30" y="603" font-size="24" fill="#ae2842" text-anchor="start">錯誤：更新一次減1 → 30、29、28、27；偶爾顯示相同不等於算法正確。</text><text x="30" y="657" font-size="26" fill="#183047" text-anchor="start">到期看毫秒；1499 ms顯示2、1 ms顯示1、0 ms顯示0。</text></svg>
