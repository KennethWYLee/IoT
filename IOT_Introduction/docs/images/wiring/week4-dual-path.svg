<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="895" viewBox="0 0 1200 895" role="img"><title>同時使用：供電參考可共用，兩條資料線不可混接</title><desc>功能節點示意，不是可取代實物profile的接線照片。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="895" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">同時使用：供電參考可共用，兩條資料線不可混接</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">功能節點示意，不是可取代實物profile的接線照片。</text><rect x="30" y="150" width="335" height="465" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="50" y="193" font-size="27" fill="#1765ad" text-anchor="start">ESP32：已核准profile</text><rect x="765" y="140" width="405" height="205" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="785" y="179" font-size="29" fill="#087768" text-anchor="start">KY-018</text><text x="785" y="218" font-size="24" fill="#183047" text-anchor="start">M：c6 → a6 → 3V3</text><text x="785" y="255" font-size="24" fill="#183047" text-anchor="start">−：c3 → a3 → GND</text><text x="785" y="302" font-size="24" fill="#183047" text-anchor="start">S：a15／c15 → ADC</text><rect x="765" y="370" width="405" height="205" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="785" y="410" font-size="29" fill="#087768" text-anchor="start">DHT11</text><text x="785" y="449" font-size="24" fill="#183047" text-anchor="start">VCC：b6 → a6 → 3V3</text><text x="785" y="487" font-size="24" fill="#183047" text-anchor="start">GND：b3 → a3 → GND</text><text x="785" y="535" font-size="23" fill="#183047" text-anchor="start">DATA：母對母 → DHT GPIO</text><text x="50" y="250" font-size="26" fill="#183047" text-anchor="start">3V3／GND共用節點</text><text x="50" y="310" font-size="26" fill="#183047" text-anchor="start">ADC輸入</text><text x="50" y="540" font-size="26" fill="#183047" text-anchor="start">DHT雙向資料</text><text x="50" y="588" font-size="23" fill="#183047" text-anchor="start">蜂鳴器：見下方核准表</text><line x1="365" y1="302" x2="765" y2="302" stroke="#1765ad" stroke-width="4"/><path d="M 377 294 L 365 302 L 377 310" fill="none" stroke="#1765ad" stroke-width="3"/><text x="400" y="280" font-size="24" fill="#1765ad" text-anchor="start">KY的S → ESP32的ADC</text><line x1="365" y1="532" x2="765" y2="532" stroke="#087768" stroke-width="4"/><text x="410" y="506" font-size="24" fill="#087768" text-anchor="start">DATA數位時序</text><rect x="30" y="653" width="1140" height="145" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="50" y="698" font-size="25" fill="#ae2842" text-anchor="start">蜂鳴器：供電、控制、GND依核准接線單，不由HW-508照片猜腳序。</text><text x="50" y="749" font-size="25" fill="#183047" text-anchor="start">GPIO只接已驗證的安全控制介面；未知負載不直接由GPIO供電。</text><text x="30" y="851" font-size="24" fill="#183047" text-anchor="start">框中的位置不是實物排針順序；第3／6列是麵包板座標，不是GPIO3／6。</text></svg>
