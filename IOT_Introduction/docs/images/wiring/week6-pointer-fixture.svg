<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="725" viewBox="0 0 1200 725" role="img"><title>同一個數字，用輕量指針指出來</title><desc>桌面機構示意，非尺寸圖；依實物固定方式與已核准掃動範圍調整。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="725" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">同一個數字，用輕量指針指出來</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">桌面機構示意，非尺寸圖；依實物固定方式與已核准掃動範圍調整。</text><rect x="35" y="145" width="620" height="475" rx="12" fill="#faf8ed" stroke="#bacbd7" stroke-width="2"/><text x="145.81415712957912" y="335" font-size="31" fill="#1765ad" text-anchor="middle">0</text><text x="197.15884977209592" y="273.8097780826351" font-size="31" fill="#1765ad" text-anchor="middle">1</text><text x="266.33536703509606" y="233.87069721924112" font-size="31" fill="#1765ad" text-anchor="middle">2</text><text x="344.99999999999994" y="220" font-size="31" fill="#1765ad" text-anchor="middle">3</text><text x="423.66463296490366" y="233.87069721924104" font-size="31" fill="#1765ad" text-anchor="middle">4</text><text x="492.841150227904" y="273.80977808263503" font-size="31" fill="#1765ad" text-anchor="middle">5</text><text x="544.1858428704209" y="334.9999999999999" font-size="31" fill="#1765ad" text-anchor="middle">6</text><rect x="290" y="400" width="110" height="100" rx="12" fill="#dbeafa" stroke="#bacbd7" stroke-width="2"/><text x="345" y="464" font-size="24" fill="#183047" text-anchor="middle">本體</text><circle cx="345" cy="400" r="25" fill="#fff" stroke="#183047" stroke-width="3"/><line x1="345" y1="400" x2="400" y2="266" stroke="#087768" stroke-width="12"/><text x="345" y="580" font-size="25" fill="#183047" text-anchor="middle">固定底板；轉動區不放手與導線</text><rect x="705" y="145" width="450" height="475" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="735" y="205" font-size="28" fill="#087768" text-anchor="start">只讓短、輕紙指針轉動</text><text x="735" y="270" font-size="25" fill="#183047" text-anchor="start">紙 → 固定在舵盤上</text><text x="735" y="325" font-size="25" fill="#183047" text-anchor="start">舵盤 → 原廠配件裝在軸</text><text x="735" y="380" font-size="25" fill="#183047" text-anchor="start">本體 → 固定在底板</text><text x="735" y="449" font-size="26" fill="#ae2842" text-anchor="start">膠不流入軸或齒輪</text><text x="735" y="504" font-size="26" fill="#ae2842" text-anchor="start">不強扳軸、不掛重物</text><text x="35" y="677" font-size="24" fill="#183047" text-anchor="start">先無負載核准小範圍，再逐格觀察並標紙盤。刻度不是實際角度證據。</text></svg>
