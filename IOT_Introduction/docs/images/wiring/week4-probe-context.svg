<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>先看表筆接在哪裡，才知道1或0在說什麼</title><desc>操作情境示意：不是將一顆220 Ω電阻先變成無限大、再變成0 Ω。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="700" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">先看表筆接在哪裡，才知道1或0在說什麼</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">操作情境示意：不是將一顆220 Ω電阻先變成無限大、再變成0 Ω。</text><rect x="25" y="145" width="375" height="395" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="45" y="191" font-size="28" fill="#1765ad" text-anchor="start">表筆分開</text><text x="45" y="251" font-size="25" fill="#183047" text-anchor="start">沒有連通路徑</text><text x="45" y="375" font-size="34" fill="#183047" text-anchor="start">左側1／OL</text><text x="45" y="468" font-size="25" fill="#183047" text-anchor="start">換大量程仍可能一樣</text><line x1="65" y1="302" x2="153" y2="302" stroke="#ae2842" stroke-width="5"/><line x1="267" y1="302" x2="355" y2="302" stroke="#183047" stroke-width="5"/><rect x="418" y="145" width="375" height="395" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="438" y="191" font-size="28" fill="#1765ad" text-anchor="start">金屬尖端相碰</text><text x="438" y="251" font-size="25" fill="#183047" text-anchor="start">很低阻的路徑</text><text x="438" y="375" font-size="34" fill="#183047" text-anchor="start">接近0</text><text x="438" y="468" font-size="25" fill="#183047" text-anchor="start">不是正在量那顆電阻</text><line x1="458" y1="302" x2="546" y2="302" stroke="#ae2842" stroke-width="5"/><line x1="660" y1="302" x2="748" y2="302" stroke="#183047" stroke-width="5"/><line x1="546" y1="302" x2="660" y2="302" stroke="#087768" stroke-width="5"/><rect x="811" y="145" width="375" height="395" rx="12" fill="#f3f7fb" stroke="#bccbd8" stroke-width="2"/><text x="831" y="191" font-size="28" fill="#1765ad" text-anchor="start">跨隔離電阻兩端</text><text x="831" y="251" font-size="25" fill="#183047" text-anchor="start">路徑經過電阻</text><text x="831" y="375" font-size="27" fill="#183047" text-anchor="start">0.22 kΩ → 220 Ω</text><text x="831" y="468" font-size="22" fill="#183047" text-anchor="start">顯示仍須核對量程／單位</text><line x1="851" y1="302" x2="939" y2="302" stroke="#ae2842" stroke-width="5"/><line x1="1053" y1="302" x2="1141" y2="302" stroke="#183047" stroke-width="5"/><line x1="939" y1="302" x2="961" y2="302" stroke="#52657a" stroke-width="3"/><rect x="961" y="282" width="70" height="40" rx="12" fill="#f7e4b4" stroke="#bccbd8" stroke-width="2"/><line x1="1031" y1="302" x2="1053" y2="302" stroke="#52657a" stroke-width="3"/><text x="30" y="600" font-size="24" fill="#ae2842" text-anchor="start">三種情況均無外部電源；同一個顯示符號要連「正在量哪條路徑」一起看。</text><text x="30" y="658" font-size="25" fill="#183047" text-anchor="start">模擬LCD用於解釋，不是實拍讀值；0不證明物理上完全沒有電阻。</text></svg>
