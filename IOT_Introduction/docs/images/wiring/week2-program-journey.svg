<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="815" viewBox="0 0 1330 815" role="img" aria-labelledby="title desc"><title id="title">程式在哪裡？文字往哪裡走？</title><desc id="desc">編譯在電腦，上傳寫入Flash，執行後Serial文字返回Monitor。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1330" height="815" fill="white"/><text x="32" y="49" font-size="32" fill="#183047" text-anchor="start" font-weight="700">程式在哪裡？文字往哪裡走？</text><text x="32" y="94" font-size="24" fill="#183047" text-anchor="start" font-weight="400">三段流程、三種證據；不是IDE真實畫面，也不是三支程式同時執行。</text><rect x="28" y="127" width="1275" height="163" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="48" y="166" font-size="27" fill="#1765ad" text-anchor="start" font-weight="700">1  Verify／Compile</text><text x="48" y="217" font-size="26" fill="#183047" text-anchor="start" font-weight="400">電腦的 .ino 原始碼</text><text x="650" y="217" font-size="32" fill="#087768" text-anchor="start" font-weight="400">→</text><text x="720" y="217" font-size="26" fill="#183047" text-anchor="start" font-weight="400">電腦產生韌體</text><text x="48" y="261" font-size="23" fill="#183047" text-anchor="start" font-weight="400">證據：編譯成功與容量摘要。板子此時不一定已收到新版。</text><rect x="28" y="311" width="1275" height="163" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="48" y="350" font-size="27" fill="#1765ad" text-anchor="start" font-weight="700">2  Upload</text><text x="48" y="401" font-size="26" fill="#183047" text-anchor="start" font-weight="400">電腦 → COM USB → CH343</text><text x="650" y="401" font-size="32" fill="#087768" text-anchor="start" font-weight="400">→</text><text x="720" y="401" font-size="26" fill="#183047" text-anchor="start" font-weight="400">ESP32 Flash</text><text x="48" y="445" font-size="23" fill="#183047" text-anchor="start" font-weight="400">證據：寫入、hash比對成功，且後續沒有錯誤。</text><rect x="28" y="495" width="1275" height="163" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="48" y="534" font-size="27" fill="#1765ad" text-anchor="start" font-weight="700">3  Serial Monitor</text><text x="48" y="585" font-size="26" fill="#183047" text-anchor="start" font-weight="400">ESP32執行程式並印文字</text><text x="650" y="585" font-size="32" fill="#087768" text-anchor="start" font-weight="400">→</text><text x="720" y="585" font-size="26" fill="#183047" text-anchor="start" font-weight="400">CH343 → 電腦Monitor</text><text x="48" y="629" font-size="23" fill="#183047" text-anchor="start" font-weight="400">證據：自己的組別、新版本與預期事件，而非只看燈亮。</text><text x="32" y="735" font-size="25" fill="#ad2944" text-anchor="start" font-weight="400">RST重啟板子Flash中的程式；只改電腦檔案或只Verify，不會把新版寫進板子。</text><text x="32" y="778" font-size="24" fill="#183047" text-anchor="start" font-weight="400">COM8是此電腦的Port編號，不是GPIO8；CH343是通訊橋，不是執行sketch的CPU。</text></svg>
