<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745" role="img"><title>三種顏色，各有自己的受控支路</title><desc>功能原理示意，非HW-479內部走線測繪；實物腳序與電流尚待核准。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="745" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">三種顏色，各有自己的受控支路</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">功能原理示意，非HW-479內部走線測繪；實物腳序與電流尚待核准。</text><rect x="30" y="155" width="310" height="450" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="55" y="205" font-size="28" fill="#1765ad" text-anchor="start">ESP32三個GPIO</text><text x="75" y="275" font-size="29" fill="#ae2842" text-anchor="start">R</text><line x1="155" y1="265" x2="450" y2="265" stroke="#ae2842" stroke-width="3"/><path d="M438.5914266954251,258.7674679981454 L450,265 L438.5914266954251,271.2325320018546" fill="none" stroke="#ae2842" stroke-width="3"/><rect x="455" y="239" width="155" height="52" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="530" y="275" font-size="23" fill="#183047" text-anchor="middle">限流電阻</text><line x1="615" y1="265" x2="735" y2="265" stroke="#ae2842" stroke-width="3"/><path d="M723.5914266954252,258.7674679981454 L735,265 L723.5914266954252,271.2325320018546" fill="none" stroke="#ae2842" stroke-width="3"/><rect x="740" y="237" width="155" height="54" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="815" y="275" font-size="26" fill="#ae2842" text-anchor="middle">R LED</text><line x1="897" y1="265" x2="1030" y2="265" stroke="#ae2842" stroke-width="3"/><text x="75" y="375" font-size="29" fill="#087768" text-anchor="start">G</text><line x1="155" y1="365" x2="450" y2="365" stroke="#087768" stroke-width="3"/><path d="M438.5914266954251,358.7674679981454 L450,365 L438.5914266954251,371.2325320018546" fill="none" stroke="#087768" stroke-width="3"/><rect x="455" y="339" width="155" height="52" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="530" y="375" font-size="23" fill="#183047" text-anchor="middle">限流電阻</text><line x1="615" y1="365" x2="735" y2="365" stroke="#087768" stroke-width="3"/><path d="M723.5914266954252,358.7674679981454 L735,365 L723.5914266954252,371.2325320018546" fill="none" stroke="#087768" stroke-width="3"/><rect x="740" y="337" width="155" height="54" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="815" y="375" font-size="26" fill="#087768" text-anchor="middle">G LED</text><line x1="897" y1="365" x2="1030" y2="365" stroke="#087768" stroke-width="3"/><text x="75" y="475" font-size="29" fill="#1765ad" text-anchor="start">B</text><line x1="155" y1="465" x2="450" y2="465" stroke="#1765ad" stroke-width="3"/><path d="M438.5914266954251,458.7674679981454 L450,465 L438.5914266954251,471.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="455" y="439" width="155" height="52" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="530" y="475" font-size="23" fill="#183047" text-anchor="middle">限流電阻</text><line x1="615" y1="465" x2="735" y2="465" stroke="#1765ad" stroke-width="3"/><path d="M723.5914266954252,458.7674679981454 L735,465 L723.5914266954252,471.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><rect x="740" y="437" width="155" height="54" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="815" y="475" font-size="26" fill="#1765ad" text-anchor="middle">B LED</text><line x1="897" y1="465" x2="1030" y2="465" stroke="#1765ad" stroke-width="3"/><line x1="1030" y1="265" x2="1030" y2="565" stroke="#183047" stroke-width="3"/><line x1="1030" y1="565" x2="240" y2="565" stroke="#183047" stroke-width="3"/><path d="M251.40857330457484,571.2325320018547 L240,565 L251.40857330457484,558.7674679981453" fill="none" stroke="#183047" stroke-width="3"/><text x="65" y="575" font-size="28" fill="#183047" text-anchor="start">GND</text><text x="675" y="607" font-size="28" fill="#183047" text-anchor="middle">共同端回到ESP32 GND</text><text x="30" y="657" font-size="24" fill="#ae2842" text-anchor="start">只畫已核准共陰模式：HIGH可能亮。共陽的接法與有效準位不同。</text><text x="30" y="703" font-size="24" fill="#183047" text-anchor="start">電阻與GPIO電流限制須核對；R／G／B不互接，也不拿電源腳代替。</text></svg>
