<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715"><title>兩組分開：在中間留一條相對門檻</title><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="715" fill="white"/><text x="32" y="53" font-size="32" fill="#183047">兩組分開：在中間留一條相對門檻</text><text x="32" y="103" font-size="24" fill="#183047">教學示例；橫軸raw無V、Ω或lux單位。粗線表示本次觀察範圍。</text><line x1="110" y1="445" x2="1110" y2="445" stroke="#52657a" stroke-width="2"/><text x="95" y="488" font-size="23" fill="#183047">0</text><text x="255" y="488" font-size="23" fill="#183047">200</text><text x="415" y="488" font-size="23" fill="#183047">400</text><text x="575" y="488" font-size="23" fill="#183047">600</text><text x="735" y="488" font-size="23" fill="#183047">800</text><text x="895" y="488" font-size="23" fill="#183047">1000</text><text x="1055" y="488" font-size="23" fill="#183047">1200</text><text x="32" y="190" font-size="27" fill="#1765ad">室內光：300～320</text><line x1="350" y1="225" x2="366" y2="225" stroke="#1765ad" stroke-width="18"/><text x="32" y="320" font-size="27" fill="#087768">遮光：900～920</text><line x1="830" y1="355" x2="846" y2="355" stroke="#087768" stroke-width="18"/><line x1="598" y1="155" x2="598" y2="440" stroke="#ae2842" stroke-width="3"/><text x="558" y="145" font-size="28" fill="#ae2842">610</text><text x="32" y="550" font-size="28" fill="#183047">(320＋900) ÷ 2＝610；先找兩組靠近空隙的邊界。</text><text x="32" y="610" font-size="27" fill="#183047">本例raw ≤ 610：室內光；raw &gt; 610：遮光。</text><text x="32" y="670" font-size="25" fill="#ae2842">這是本地觀察的分類規則，不能推廣成所有環境的永久答案。</text></svg>
