<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="751" viewBox="0 0 1380 751" role="img" aria-labelledby="title desc"><title id="title">兩個百分比，必須分開找分母</title><desc id="desc">用歷史Verify數字比較Flash應用分割區與編譯時RAM摘要，PSRAM另行判定。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1380" height="751" fill="white"/><text x="32" y="49" font-size="32" fill="#183047" text-anchor="start" font-weight="700">兩個百分比，必須分開找分母</text><text x="32" y="96" font-size="23" fill="#183047" text-anchor="start" font-weight="400">以下使用先前候選按鈕程式的編譯摘要；示意框不按容量比例，不是本次重編譯結果。</text><rect x="28" y="135" width="670" height="422" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="52" y="179" font-size="29" fill="#1765ad" text-anchor="start" font-weight="700">Flash：非揮發儲存</text><text x="52" y="224" font-size="25" fill="#183047" text-anchor="start" font-weight="400">N16：整顆容量16,777,216 bytes</text><rect x="52" y="252" width="620" height="185" rx="10" fill="#e7f1ff" stroke="#c6d4e0" stroke-width="2"/><text x="76" y="294" font-size="24" fill="#183047" text-anchor="start" font-weight="400">當次應用分割區 Maximum = 3,145,728</text><text x="76" y="342" font-size="27" fill="#1765ad" text-anchor="start" font-weight="700">這支sketch = 302,598 bytes</text><text x="76" y="391" font-size="27" fill="#183047" text-anchor="start" font-weight="400">302598 ÷ 3145728 ≈ 9.62%</text><text x="52" y="485" font-size="24" fill="#183047" text-anchor="start" font-weight="400">其餘區域另有系統／其他分割用途。</text><text x="52" y="527" font-size="24" fill="#ad2944" text-anchor="start" font-weight="400">9%不代表占用整顆16 MB Flash的9%。</text><rect x="724" y="135" width="624" height="422" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="747" y="179" font-size="29" fill="#087768" text-anchor="start" font-weight="700">RAM：執行工作空間</text><text x="747" y="224" font-size="25" fill="#183047" text-anchor="start" font-weight="400">摘要預算：327,680 bytes</text><rect x="747" y="252" width="578" height="185" rx="10" fill="#e8f5ef" stroke="#c6d4e0" stroke-width="2"/><text x="768" y="294" font-size="25" fill="#183047" text-anchor="start" font-weight="400">Global variables = 22,136 bytes</text><text x="768" y="342" font-size="27" fill="#087768" text-anchor="start" font-weight="700">22136 ÷ 327680 ≈ 6.76%</text><text x="768" y="391" font-size="25" fill="#183047" text-anchor="start" font-weight="400">摘要剩餘：305,544 bytes</text><text x="747" y="485" font-size="24" fill="#183047" text-anchor="start" font-weight="400">後續stack／heap／系統仍會用RAM。</text><text x="747" y="527" font-size="24" fill="#ad2944" text-anchor="start" font-weight="400">6%不是完整執行期間的峰值用量。</text><rect x="28" y="589" width="1320" height="132" rx="10" fill="#f3f7fb" stroke="#c6d4e0" stroke-width="2"/><text x="52" y="632" font-size="25" fill="#183047" text-anchor="start" font-weight="400">R8 PSRAM是另一項額外RAM；要看runtime識別，不能由Global variables那行證明。</text><text x="52" y="683" font-size="25" fill="#183047" text-anchor="start" font-weight="400">分割區、核心套件或程式變了，百分比可不同；不要為了數字好看而亂改設定。</text></svg>
