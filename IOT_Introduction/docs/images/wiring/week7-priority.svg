<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="765" viewBox="0 0 1200 765" role="img"><title>先處理哪一個，必須寫成可重現的規則</title><desc>由上到下；前兩層若已結算，後面的計分與Finish不再執行。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="765" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">先處理哪一個，必須寫成可重現的規則</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">由上到下；前兩層若已結算，後面的計分與Finish不再執行。</text><rect x="35" y="140" width="1130" height="74" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="62" y="187" font-size="30" fill="#ae2842" text-anchor="start">1</text><text x="125" y="187" font-size="27" fill="#ae2842" text-anchor="start">中止／持續故障</text><text x="650" y="187" font-size="24" fill="#183047" text-anchor="start">ABORTED；不算玩家失敗</text><rect x="35" y="228" width="1130" height="74" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="62" y="275" font-size="30" fill="#ae2842" text-anchor="start">2</text><text x="125" y="275" font-size="27" fill="#ae2842" text-anchor="start">elapsed ≥ 30000 ms</text><text x="650" y="275" font-size="24" fill="#183047" text-anchor="start">FAILED；不再處理這輪事件</text><rect x="35" y="316" width="1130" height="74" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="62" y="363" font-size="30" fill="#1765ad" text-anchor="start">3</text><text x="125" y="363" font-size="27" fill="#1765ad" text-anchor="start">依同一now決定燈色</text><text x="650" y="363" font-size="24" fill="#183047" text-anchor="start">不是沿用上一輪的顏色</text><rect x="35" y="404" width="1130" height="74" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="62" y="451" font-size="30" fill="#087768" text-anchor="start">4</text><text x="125" y="451" font-size="27" fill="#087768" text-anchor="start">處理新遮光</text><text x="650" y="451" font-size="24" fill="#183047" text-anchor="start">綠+1／紅−1；限制0～6</text><rect x="35" y="492" width="1130" height="74" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="62" y="539" font-size="30" fill="#1765ad" text-anchor="start">5</text><text x="125" y="539" font-size="27" fill="#1765ad" text-anchor="start">處理新Finish</text><text x="650" y="539" font-size="24" fill="#183047" text-anchor="start">看更新後count是否6</text><rect x="35" y="580" width="1130" height="74" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="62" y="627" font-size="30" fill="#183047" text-anchor="start">6</text><text x="125" y="627" font-size="27" fill="#183047" text-anchor="start">更新輸出與再檢查</text><text x="650" y="627" font-size="24" fill="#183047" text-anchor="start">新時間檢查安全，不重播事件</text><text x="35" y="720" font-size="25" fill="#183047" text-anchor="start">本輪快照表示軟體確認順序，不是量到實體動作在微秒尺度的先後。</text></svg>
