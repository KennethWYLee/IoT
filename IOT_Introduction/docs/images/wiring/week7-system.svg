<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="735" viewBox="0 0 1200 735" role="img"><title>一份遊戲資料，分工給不同零件</title><desc>功能示意，不是GPIO腳序；電流回路請另看供電圖。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="735" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">一份遊戲資料，分工給不同零件</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">功能示意，不是GPIO腳序；電流回路請另看供電圖。</text><rect x="35" y="160" width="295" height="470" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="180" y="216" font-size="30" fill="#1765ad" text-anchor="middle">輸入</text><text x="65" y="302" font-size="26" fill="#183047" text-anchor="start">Start：申請開始</text><text x="65" y="387" font-size="26" fill="#183047" text-anchor="start">Finish：確認結束</text><text x="65" y="472" font-size="26" fill="#183047" text-anchor="start">KY：光線原始值</text><text x="65" y="562" font-size="26" fill="#ae2842" text-anchor="start">雙鍵：人工中止</text><rect x="440" y="240" width="300" height="300" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="590" y="299" font-size="27" fill="#087768" text-anchor="middle">ESP32共同資料</text><text x="590" y="373" font-size="25" fill="#183047" text-anchor="middle">狀態／時間／燈色</text><text x="590" y="450" font-size="27" fill="#183047" text-anchor="middle">目前有效count</text><rect x="850" y="160" width="315" height="470" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="1007" y="216" font-size="30" fill="#1765ad" text-anchor="middle">輸出</text><text x="875" y="302" font-size="26" fill="#183047" text-anchor="start">RGB：規則燈色</text><text x="875" y="387" font-size="25" fill="#183047" text-anchor="start">OLED：時間／次數</text><text x="875" y="472" font-size="25" fill="#183047" text-anchor="start">SG90：0～6指針</text><text x="875" y="562" font-size="25" fill="#183047" text-anchor="start">蜂鳴器：失敗短聲</text><line x1="335" y1="390" x2="430" y2="390" stroke="#1765ad" stroke-width="3"/><path d="M418.5914266954251,383.7674679981454 L430,390 L418.5914266954251,396.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><line x1="745" y1="390" x2="840" y2="390" stroke="#1765ad" stroke-width="3"/><path d="M828.5914266954252,383.7674679981454 L840,390 L828.5914266954252,396.2325320018546" fill="none" stroke="#1765ad" stroke-width="3"/><text x="35" y="690" font-size="24" fill="#183047" text-anchor="start">DHT在Week 4已有學習任務，不混入本遊戲勝負；此圖箭頭是資料方向。</text></svg>
