<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img"><title>量的是哪兩點？V+相對外部負極</title><desc>空載時尚未接舵機；負載時在同一對端子量測。所有數值需與核准範圍比較。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif}</style><rect width="1200" height="790" fill="white"/><text x="30" y="48" font-size="32" fill="#183047" text-anchor="start">量的是哪兩點？V+相對外部負極</text><text x="30" y="91" font-size="23" fill="#52657a" text-anchor="start">空載時尚未接舵機；負載時在同一對端子量測。所有數值需與核准範圍比較。</text><rect x="35" y="175" width="290" height="330" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="75" y="230" font-size="27" fill="#183047" text-anchor="start">核准外部電源</text><text x="75" y="315" font-size="28" fill="#ae2842" text-anchor="start">正極</text><text x="75" y="445" font-size="28" fill="#183047" text-anchor="start">負極</text><rect x="880" y="175" width="280" height="330" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="930" y="230" font-size="28" fill="#183047" text-anchor="start">舵機負載</text><text x="920" y="315" font-size="28" fill="#ae2842" text-anchor="start">V+</text><text x="920" y="445" font-size="28" fill="#183047" text-anchor="start">GND</text><line x1="325" y1="305" x2="880" y2="305" stroke="#ae2842" stroke-width="3"/><path d="M868.5914266954252,298.7674679981454 L880,305 L868.5914266954252,311.2325320018546" fill="none" stroke="#ae2842" stroke-width="3"/><line x1="880" y1="435" x2="325" y2="435" stroke="#183047" stroke-width="3"/><path d="M336.4085733045749,441.2325320018546 L325,435 L336.4085733045748,428.7674679981454" fill="none" stroke="#183047" stroke-width="3"/><rect x="430" y="525" width="355" height="105" rx="12" fill="#f3f7fb" stroke="#bacbd7" stroke-width="2"/><text x="607" y="565" font-size="25" fill="#1765ad" text-anchor="middle">電表：直流電壓檔</text><text x="607" y="606" font-size="25" fill="#183047" text-anchor="middle">V紅端 − V黑端</text><line x1="475" y1="525" x2="475" y2="305" stroke="#ae2842" stroke-width="3"/><line x1="740" y1="525" x2="740" y2="435" stroke="#183047" stroke-width="3"/><text x="405" y="492" font-size="24" fill="#ae2842" text-anchor="start">紅</text><text x="755" y="491" font-size="24" fill="#183047" text-anchor="start">黑</text><text x="35" y="690" font-size="25" fill="#ae2842" text-anchor="start">量測支路平行跨兩端；不把電表插10A孔接在同樣位置。</text><text x="35" y="738" font-size="23" fill="#183047" text-anchor="start">先OFF固定測點，再ON讀值；改線前OFF。沒有量到電流或瞬間最低電壓。</text></svg>
